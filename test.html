<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>CRT Perception Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================================
     CSS VARIABLES & PREMIUM CLINICAL THEME
     ========================================================================= */
  :root {
    --bg-body: #f8fafc;        /* Slate 50 */
    --bg-card: #ffffff;        /* White */
    --bg-panel: #ffffff;
    --text-main: #0f172a;      /* Slate 900 */
    --text-muted: #64748b;     /* Slate 500 */
    --border: #e2e8f0;         /* Slate 200 */
    
    /* Medical Blue Palette */
    --primary: #2563eb;        /* Blue 600 */
    --primary-hover: #1d4ed8;  /* Blue 700 */
    --primary-light: #eff6ff;  /* Blue 50 */
    
    --success: #059669;        /* Emerald 600 */
    --success-light: #ecfdf5;  /* Emerald 50 */
    --danger: #ef4444;         /* Red 500 */
    --warning: #f59e0b;        /* Amber 500 */

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 9999px;
    
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    
    --font-sans: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  [data-theme="dark"] {
    --bg-body: #0f172a;        /* Slate 900 */
    --bg-card: #1e293b;        /* Slate 800 */
    --bg-panel: #1e293b;
    --text-main: #f8fafc;      /* Slate 50 */
    --text-muted: #94a3b8;     /* Slate 400 */
    --border: #334155;         /* Slate 700 */
    
    --primary: #3b82f6;        /* Blue 500 */
    --primary-hover: #60a5fa;  /* Blue 400 */
    --primary-light: rgba(59, 130, 246, 0.1);
    
    --success: #10b981;        
    --success-light: rgba(16, 185, 129, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg-body);
    color: var(--text-main);
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.3s, color 0.3s;
  }

  a { color: var(--primary); text-decoration: none; cursor: pointer; font-weight: 500; }
  a:hover { color: var(--primary-hover); }
  button { font-family: inherit; cursor: pointer; border: none; background: none; outline: none; }
  input, select { font-family: inherit; outline: none; }

  /* =========================================================================
     GLOBAL HEADER (Polished)
     ========================================================================= */
  .hdr {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand h1 { font-size: 1.15rem; font-weight: 700; margin:0; letter-spacing: -0.02em; }
  .brand .sub { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
  .dot { 
    width: 12px; height: 12px; background: var(--primary); 
    border-radius: var(--radius-full); 
    box-shadow: 0 0 0 4px var(--primary-light);
  }
  
  .actions { display: flex; align-items: center; gap: 16px; font-size: 0.9rem; }
  .actions button { 
    color: var(--primary); font-weight: 600; 
    padding: 6px 12px; border-radius: var(--radius-sm);
    transition: background 0.2s;
  }
  .actions button:hover { background: var(--primary-light); }
  .who { color: var(--text-muted); display: none; font-weight: 500; }
  @media (min-width: 600px) { .who { display: block; } }

  body[data-view="player"] .hdr { display: none; }

  /* =========================================================================
     LAYOUT & CARDS (Professional Look)
     ========================================================================= */
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
  body[data-view="player"] .wrap { padding: 0; max-width: 100%; }

  .page-head { margin-bottom: 32px; }
  .page-head h2 { font-size: 1.75rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.03em; }
  .muted { color: var(--text-muted); font-size: 1rem; }

  .card {
    background: var(--bg-card); padding: 32px; border-radius: var(--radius-lg);
    border: 1px solid var(--border); box-shadow: var(--shadow-md);
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .tile {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 24px; text-align: left; transition: all 0.2s ease;
    display: flex; flex-direction: column; gap: 16px;
    box-shadow: var(--shadow-sm);
  }
  .tile:hover { 
    border-color: var(--primary); transform: translateY(-4px); 
    box-shadow: var(--shadow-md);
  }
  .tile .thumb { font-size: 2.2rem; }
  .tile .t { font-weight: 600; font-size: 1.15rem; color: var(--text-main); }
  .tile .m { color: var(--text-muted); font-size: 0.95rem; margin-top: 4px; }

  .vid-row {
    display: flex; align-items: center; gap: 20px; padding: 16px 20px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-md); margin-bottom: 12px; cursor: pointer;
    transition: all 0.2s; box-shadow: var(--shadow-sm);
  }
  .vid-row:hover { border-color: var(--primary); background: var(--primary-light); transform: translateX(4px); }
  .vid-row .num { font-family: var(--font-mono); color: var(--text-muted); font-weight: 600; font-size: 1.1rem; }
  .vid-row .info { flex: 1; }
  .vid-row .t { font-weight: 600; color: var(--text-main); font-size: 1.05rem; }
  .vid-row .m { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }
  
  .badge {
    padding: 6px 12px; border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 600;
    background: var(--border); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .badge.done { background: var(--success-light); color: var(--success); }
  
  /* Forms */
  .field { margin-bottom: 20px; }
  .field label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; color: var(--text-main); }
  .field input, .field select {
    width: 100%; padding: 14px 16px; border-radius: var(--radius-md);
    border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main);
    font-size: 1rem; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light);
  }
  
  /* Buttons */
  .btn {
    background: var(--primary); color: #fff; padding: 14px 24px;
    border-radius: var(--radius-md); font-weight: 600; font-size: 1.05rem; 
    transition: all 0.2s; box-shadow: var(--shadow-sm);
  }
  .btn:hover { background: var(--primary-hover); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn.block { width: 100%; display: block; text-align: center; }
  .btn.ghost { background: transparent; color: var(--primary); border: 2px solid var(--primary); box-shadow: none; }
  .btn.ghost:hover { background: var(--primary-light); }
  .err { color: var(--danger); font-size: 0.95rem; margin-top: 12px; font-weight: 500; background: rgba(239, 68, 68, 0.1); padding: 12px; border-radius: var(--radius-sm); }

  /* =========================================================================
     PLAYER VIEW (100dvh FULL SCREEN - IMMERSIVE)
     ========================================================================= */
  .player-layout {
    display: flex; flex-direction: column;
    height: 100dvh; /* Mobile viewport fix */
    background: #000;
  }

  /* Player Mini-Header (Glassmorphism) */
  .player-hdr {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; 
    background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    color: #f8fafc; flex-shrink: 0; position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  }
  .player-hdr button { color: #cbd5e1; font-weight: 600; font-size: 1rem; transition: color 0.2s; }
  .player-hdr button:hover { color: #fff; }
  .player-hdr .title { font-weight: 600; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; margin: 0 16px; font-size: 1.05rem; }
  .player-hdr .progress { color: #94a3b8; font-size: 0.9rem; font-weight: 600; white-space: nowrap; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: var(--radius-full);}

  /* Video Area */
  .vid-stage {
    flex: 1; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: #000; overflow: hidden;
  }
  video { width: 100%; height: 100%; object-fit: contain; }
  
  .vid-loading {
    position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 1.2rem; gap: 12px; z-index: 10;
  }
  .spin { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Scrub Bar inside the video stage */
  .scrub-wrapper {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 40px 20px 16px; /* gradient fade */
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 50%, transparent 100%);
    z-index: 15;
  }
  .scrub { width: 100%; accent-color: var(--primary); margin: 0; cursor: pointer; height: 6px; }
  .stamp-tick {
    position: absolute; bottom: 26px; width: 4px; height: 14px;
    background: var(--warning); transform: translateX(-50%); border-radius: 2px;
    pointer-events: none; box-shadow: 0 0 8px var(--warning);
  }

  /* Bottom Controls Area */
  .control-panel {
    background: var(--bg-card); border-top: 1px solid var(--border);
    padding: 20px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 20px;
    padding-bottom: max(20px, env(safe-area-inset-bottom)); /* iOS safe area */
    box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
    z-index: 20;
  }

  .readout { display: flex; justify-content: space-between; align-items: flex-end; }
  .clock { display: flex; flex-direction: column; }
  .clock .lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 2px;}
  .clock .val { font-family: var(--font-mono); font-size: 2.2rem; font-weight: 700; line-height: 1; color: var(--text-main); letter-spacing: -0.02em;}
  .clock .frame { font-family: var(--font-mono); font-size: 0.85rem; color: var(--primary); margin-top: 6px; font-weight: 500; background: var(--primary-light); display: inline-block; padding: 2px 8px; border-radius: 4px; width: fit-content;}

  /* Transport Row (Play/Pause, Step, Speed) */
  .transport-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .transport { display: flex; align-items: center; gap: 6px; background: var(--bg-body); border-radius: var(--radius-md); padding: 6px; border: 1px solid var(--border); }
  .tbtn { padding: 10px 16px; border-radius: var(--radius-sm); font-weight: 600; color: var(--text-main); font-size: 1.1rem; transition: background 0.2s;}
  .tbtn:disabled { opacity: 0.4; }
  .tbtn:not(:disabled):hover { background: var(--border); }
  .tbtn.play { background: var(--primary); color: #fff; width: 64px; }
  .tbtn.play:hover { background: var(--primary-hover); }
  
  .speed-row { display: flex; gap: 4px; background: var(--bg-body); padding: 6px; border-radius: var(--radius-md); border: 1px solid var(--border); }
  .speed-btn { padding: 8px 14px; border-radius: var(--radius-sm); font-weight: 600; color: var(--text-muted); font-size: 0.95rem; transition: all 0.2s; }
  .speed-btn.active { background: var(--bg-card); color: var(--text-main); box-shadow: var(--shadow-sm); }

  /* =========================================================================
     GIANT ACTION ZONE (Polished & Tactile)
     ========================================================================= */
  #actionZone { margin-top: 4px; }
  
  .btn-giant {
    width: 100%; padding: 22px; border-radius: var(--radius-lg); font-size: 1.25rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s;
    box-shadow: var(--shadow-md); display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .btn-giant:active { transform: scale(0.98); box-shadow: var(--shadow-sm); }
  .btn-giant:disabled { opacity: 0.6; transform: none; box-shadow: none; cursor: not-allowed; }
  
  /* Pulsing effect for the mark button to draw attention */
  @keyframes pulse-shadow {
    0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); }
    70% { box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
    100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
  }
  .btn-mark { background: var(--primary); color: #fff; animation: pulse-shadow 2s infinite; }
  .btn-mark:hover { background: var(--primary-hover); animation: none; }
  
  .btn-save { background: var(--success); color: #fff; }
  .btn-save:hover { background: #047857; }

  .marked-state { display: flex; flex-direction: column; gap: 16px; animation: slideUp 0.3s ease-out; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .marked-stats { 
    text-align: center; background: var(--success-light); color: var(--success);
    padding: 16px; border-radius: var(--radius-md); font-weight: 600; border: 1px solid rgba(16, 185, 129, 0.2);
    display: flex; flex-direction: column; gap: 4px;
  }
  .marked-stats .stat-lbl { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.8; }
  .marked-stats span.val { font-family: var(--font-mono); font-size: 1.8rem; font-weight: 700; line-height: 1; }
  
  .marked-actions { display: flex; gap: 12px; }
  .btn-remark {
    background: transparent; color: var(--text-muted); border: 2px solid var(--border);
    border-radius: var(--radius-lg); padding: 0 24px; font-weight: 600; white-space: nowrap;
    transition: all 0.2s;
  }
  .btn-remark:hover { background: var(--border); color: var(--text-main); }

  @media (min-width: 768px) {
    /* Tablet & Desktop Layout Tuning */
    .player-layout { flex-direction: row; height: calc(100vh - 73px); } /* subtract header height */
    body[data-view="player"] .hdr { display: flex; } /* Show global header on desktop */
    .player-hdr { display: none; } /* Hide mini-header on desktop */
    .control-panel { width: 420px; border-top: none; border-left: 1px solid var(--border); justify-content: center; padding: 32px; }
    .scrub-wrapper { padding-bottom: 24px; }
  }
</style>
<script>
  // Apply saved theme before first paint
  (() => {
    try {
      const t = localStorage.getItem('crt-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch {}
  })();
</script>
</head>
<body>
<div class="hdr">
  <div class="brand">
    <div class="dot"></div>
    <div>
      <h1>CRT Perception Study</h1>
      <div class="sub">Clinical Capillary Refill Assessment</div>
    </div>
  </div>
  <div class="actions" id="hdrActions"></div>
</div>

<div class="wrap" id="app"></div>

<script>
/* =========================================================================
   CONFIG & SUPABASE BACKEND
   ========================================================================= */
const DEFAULT_FPS = 30;
const FPS_OVERRIDES = {};
const MANUAL_COLLECTIONS = [];
let COLLECTIONS = [];

const STORAGE_KEY = 'crt-study-annotations';
const SESSION_KEY = 'crt-study-session';
const THEME_KEY = 'crt-theme';

const SUPABASE_URL = 'https://nsmdjwgurzoyfkxatgzz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WSs9V5v6MUMCFtXJyF3opg_KkQGypYr';
const STORAGE_BUCKET = 'vids';
const BUCKET_PUBLIC_URL = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/`;
const REST_URL = `${SUPABASE_URL}/rest/v1`;
const SUPA_HEADERS = {
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
  'Content-Type': 'application/json'
};

/* =========================================================================
   APPLICATION LOGIC
   ========================================================================= */
(() => {
  const app = document.getElementById('app');
  const hdrActions = document.getElementById('hdrActions');
  let state = { view: 'login', user: null, col: null, vidIndex: 0, marked: null, saving: false, msg: '', err: '', speed: 1 };
  restoreSession();
  let annotations = loadAnnotations();

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = t => {
    if (t == null) return '--:--.--';
    const m = Math.floor(t / 60), s = t % 60;
    return String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0');
  };
  const frameOf = (t, fps) => Math.floor(t * (Number(fps) || 30) + 1e-6);
  const csvCell = value => `"${String(value ?? '').replaceAll('"', '""')}"`;

  /* ---------- Persistence ---------- */
  function loadAnnotations() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; } }
  function saveAnnotations() { localStorage.setItem(STORAGE_KEY, JSON.stringify(annotations)); }
  function saveSession() {
    try {
      if (!state.user) { localStorage.removeItem(SESSION_KEY); return; }
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        user: state.user, view: state.view === 'login' ? 'collections' : state.view,
        col: state.col, vidIndex: state.vidIndex
      }));
    } catch {}
  }
  function restoreSession() {
    try {
      const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      if (s && s.user && s.user.name) {
        state.user = s.user; state.view = s.view || 'collections';
        state.col = s.col ?? null; state.vidIndex = Number.isInteger(s.vidIndex) ? s.vidIndex : 0;
        state.marked = null; state.saving = false; state.msg = ''; state.err = '';
      }
    } catch {}
  }
  function isDone(colName, videoIndex) {
    if (!state.user) return false;
    return annotations.some(a => a.name === state.user.name && a.collection === colName && a.videoIndex === videoIndex);
  }
  function doneCount(col) { return col.videos.reduce((n, _v, i) => n + (isDone(col.name, i + 1) ? 1 : 0), 0); }

  /* ---------- Theme ---------- */
  function currentTheme() {
    const set = document.documentElement.getAttribute('data-theme');
    if (set) return set;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function toggleTheme() {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch {}
    render();
  }

  /* ---------- Sync / CSV ---------- */
  function exportCsv() {
    const header = ['name', 'status', 'age', 'collection', 'videoIndex', 'videoTitle', 'timeSeconds', 'crtSeconds', 'rawTimeSeconds', 'stampTimeSeconds', 'fps', 'frameIndex', 'stampFrame', 'submittedAt'];
    const rows = [header.join(',')];
    for (const row of annotations) {
      rows.push([ csvCell(row.name), csvCell(row.status), csvCell(row.age), csvCell(row.collection), csvCell(row.videoIndex), csvCell(row.videoTitle), csvCell(row.timeSeconds), csvCell(row.crtSeconds), csvCell(row.rawTimeSeconds), csvCell(row.stampTimeSeconds), csvCell(row.fps), csvCell(row.frameIndex), csvCell(row.stampFrame), csvCell(row.submittedAt) ].join(','));
    }
    const blob = new Blob([rows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'crt-study-annotations.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  async function saveToExcel(payload) {
    const row = {
      display_name: payload.name, role: payload.status, age_group: payload.age, video_id: payload.videoId || null, skipped: false,
      mark_file_time_s: payload.rawTimeSeconds === '' ? null : payload.rawTimeSeconds,
      frame_number: payload.frameIndex === '' ? null : payload.frameIndex,
      crt_s: payload.crtSeconds === '' ? null : payload.crtSeconds,
      fps_used: payload.fps === '' ? null : payload.fps,
      release_file_time_s: payload.stampTimeSeconds === '' ? null : payload.stampTimeSeconds,
      stamp_frame_used: payload.stampFrame === '' ? null : payload.stampFrame,
      submitted_at: payload.submittedAt
    };
    const response = await fetch(`${REST_URL}/annotations`, {
      method: 'POST', headers: { ...SUPA_HEADERS, 'Prefer': 'return=minimal' }, body: JSON.stringify(row)
    });
    if (!response.ok) throw new Error('Supabase rejected the annotation');
    return { ok: true };
  }

  /* ---------- Render Engine ---------- */
  function render() {
    saveSession();
    document.body.dataset.view = state.view;
    const themeIcon = currentTheme() === 'dark' ? '☀️' : '🌙';
    let actions = `<button title="Toggle theme" onclick="window.__act('theme')">${themeIcon}</button>`;
    if (state.user) {
      actions += `<span class="who">${esc(state.user.name)} · ${esc(state.user.status)}</span>`;
      const pending = annotations.filter(a => a.synced === false).length;
      if (pending) actions += `<button class="err" title="Unsaved marks" onclick="window.__act('retrysync')" style="margin:0; padding:6px 12px;">⟳ ${pending} unsaved</button>`;
      if (annotations.length) actions += `<button onclick="window.__act('export')">Export CSV</button>`;
      actions += `<button onclick="window.__act('logout')">Sign out</button>`;
    }
    hdrActions.innerHTML = actions;

    let html = '';
    if (state.view === 'login') html = viewLogin();
    else if (state.view === 'collections') html = viewCollections();
    else if (state.view === 'videos') html = viewVideos();
    else if (state.view === 'player') html = viewPlayer();
    
    app.innerHTML = html;

    if (state.view === 'player') { attachVideoEvents(); startClock(); renderActionZone(); } else stopClock();
  }

  function viewLogin() {
    return `<div class="card" style="max-width:500px;margin:24px auto;">
      <div class="page-head">
        <h2>Join the Clinical Study</h2>
        <p class="muted">Watch short capillary-refill clips and press the mark button the exact moment you perceive skin colour return.</p>
      </div>
      <div class="field"><label>Participant Name</label><input id="f-name" placeholder="e.g. Dr. A. Perera" autocomplete="name"></div>
      <div class="field"><label>Clinical Role</label>
        <select id="f-status"><option value="">Select your role…</option><option>Nurse</option><option>Doctor</option><option>Medical student</option><option>Paramedic</option><option>Researcher</option><option>Other</option></select></div>
      <div class="field"><label>Age Group</label>
        <select id="f-age"><option value="">Select age group…</option><option>18-24</option><option>25-34</option><option>35-44</option><option>45-54</option><option>55+</option></select></div>
      <button class="btn block" onclick="window.__act('login')" style="margin-top: 32px;">Begin Assessment</button>
      ${state.err ? `<div class="err">${esc(state.err)}</div>` : ''}
    </div>`;
  }

  function viewCollections() {
    const items = COLLECTIONS.map(c => {
      const done = doneCount(c);
      return `<button class="tile" onclick="window.__act('opencol','${c.id}')">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div class="thumb">${c.icon || '📁'}</div>
          <span class="badge ${done === c.videos.length && c.videos.length ? 'done' : ''}">${done}/${c.videos.length} completed</span>
        </div>
        <div><div class="t">${esc(c.name)}</div><div class="m">${c.videos.length} clinical case${c.videos.length !== 1 ? 's' : ''}</div></div>
      </button>`;
    }).join('');
    return `<div class="page-head"><h2>Video Datasets</h2><p class="muted">Select a case folder to begin your assessment.</p></div>
      ${items ? `<div class="grid">${items}</div>` : '<div class="card muted">No datasets available.</div>'}`;
  }

  function viewVideos() {
    const col = COLLECTIONS.find(c => c.id === state.col);
    if (!col) return `<div class="card muted">Loading cases…</div>`;
    const done = doneCount(col);
    const items = col.videos.map((v, i) => {
      const d = isDone(col.name, i + 1);
      return `<div class="vid-row" onclick="window.__act('openvid',${i})">
        <div class="num">${String(i + 1).padStart(2, '0')}</div>
        <div class="info"><div class="t">${esc(v.title)}</div><div class="m">${esc(v.file || '')}</div></div>
        <span class="badge ${d ? 'done' : ''}">${d ? '✓ Assessed' : 'Start'}</span>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:20px;"><a onclick="window.__act('backcols')">‹ Back to Datasets</a></div>
      <div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-end;">
        <div>
          <h2>${esc(col.name)}</h2>
          <p class="muted">Select a case to assess</p>
        </div>
        <span class="badge" style="font-size: 0.9rem;">${done} of ${col.videos.length} Done</span>
      </div>
      ${items || '<div class="card muted">No cases in this dataset.</div>'}`;
  }

  function viewPlayer() {
    const col = COLLECTIONS.find(c => c.id === state.col);
    if (!col || !col.videos[state.vidIndex]) return `<div class="card muted">Loading video…</div>`;
    const v = col.videos[state.vidIndex];
    const done = isDone(col.name, state.vidIndex + 1);
    
    return `
      <div class="player-layout">
        <div class="player-hdr">
          <button onclick="window.__act('backcols')">‹ Back</button>
          <div class="title">${esc(v.title)}</div>
          <div class="progress">${done ? '✓ ' : ''}${state.vidIndex + 1} / ${col.videos.length}</div>
        </div>
        
        <div class="vid-stage">
          <video id="vid" src="${esc(v.url)}" playsinline preload="auto" disablepictureinpicture controlslist="nodownload noremoteplayback"></video>
          <div class="vid-loading" id="vidLoading" style="display:none;"><span class="spin"></span> Loading clinical media...</div>
          <div class="scrub-wrapper">
            <input type="range" id="scrub" class="scrub" min="0" max="1000" value="0" step="1" oninput="window.__scrub(this.value)">
            <div class="stamp-tick" id="stampTick" hidden></div>
          </div>
        </div>

        <div class="control-panel">
          <div class="readout">
            <div class="clock">
              <span class="lbl">${v.stampFrame != null ? 'Capillary Refill Time' : 'Video Time'}</span>
              <span class="val" id="clock">00:00.00</span>
              <span class="frame" id="frame">${v.stampFrame != null ? `Release Frame: ${v.stampFrame}` : `Frame 0`}</span>
            </div>
          </div>
          ${state.err ? `<div class="err" style="margin-top:-10px; margin-bottom:10px;">${esc(state.err)}</div>` : ''}

          <div class="transport-row">
            <div class="transport">
              <button class="tbtn" onclick="window.__act('stepback')">◀</button>
              <button class="tbtn play" id="playpause" onclick="window.__act('playpause')">▶</button>
              <button class="tbtn" onclick="window.__act('stepfwd')">▶</button>
            </div>
            <div class="speed-row">
              ${[0.5, 1].map(r => `<button class="speed-btn ${state.speed === r ? 'active' : ''}" onclick="window.__act('speed','${r}')">${r === 1 ? '1.0×' : r + '×'}</button>`).join('')}
            </div>
          </div>

          <div id="actionZone"></div>
        </div>
      </div>`;
  }

  /* ---------- Action Zone (Professional Marking State) ---------- */
  function renderActionZone() {
    const el = document.getElementById('actionZone');
    if (!el) return;
    const col = COLLECTIONS.find(c => c.id === state.col);
    const v = col?.videos[state.vidIndex];
    if (!v) return;
    
    const hasNext = state.vidIndex < col.videos.length - 1;
    const crt = crtAt(v, state.marked);
    
    if (state.marked == null) {
      el.innerHTML = `<button class="btn-giant btn-mark" id="markBtn" onclick="window.__act('mark')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4" fill="currentColor"></circle></svg>
        Mark Colour Return
      </button>`;
    } else {
      const crtVal = crt != null ? Math.max(0, crt).toFixed(2) + 's' : fmt(state.marked);
      el.innerHTML = `
        <div class="marked-state">
          <div class="marked-stats">
            <span class="stat-lbl">Recorded CRT</span>
            <span class="val">${crtVal}</span>
          </div>
          <div class="marked-actions">
            <button class="btn-remark" onclick="window.__act('remark')">↺ Re-mark</button>
            <button class="btn-giant btn-save" onclick="window.__act('submit')" ${state.saving ? 'disabled' : ''} style="flex:1;">
              ${state.saving ? 'Saving...' : (hasNext ? 'Save & Next ›' : 'Complete ›')}
            </button>
          </div>
        </div>
      `;
    }
  }

  /* ---------- Player Core Logic ---------- */
  let clockTimer = null;
  function playerCtx() { return { vid: document.getElementById('vid'), fps: Number(currentVideo()?.fps) || 30 }; }
  let scrubbing = false;
  function currentVideo() { return COLLECTIONS.find(c => c.id === state.col)?.videos[state.vidIndex] || null; }
  function frameInFile(v, t) { return Math.round(t * ((v && v.fps) || 30)); }
  function crtAt(v, t) {
    if (!v || v.stampFrame == null || !v.fps || !v.realFps) return null;
    return (frameInFile(v, t) - v.stampFrame) / v.realFps;
  }
  
  function updateClockNow() {
    const { vid, fps } = playerCtx();
    if (!vid) return;
    const v = currentVideo();
    const c = document.getElementById('clock');
    const f = document.getElementById('frame');
    const pp = document.getElementById('playpause');
    const sc = document.getElementById('scrub');
    const t = vid.currentTime;
    const crt = crtAt(v, t);
    
    if (crt != null) {
      if (c) c.textContent = fmt(Math.max(0, crt));
      if (f) f.textContent = crt < 0 ? `Compression Phase (Frm ${frameInFile(v, t)})` : `Frame ${frameInFile(v, t)}`;
    } else {
      if (c) c.textContent = fmt(t);
      if (f) f.textContent = `Frame ${frameOf(t, fps)}`;
    }
    
    if (pp) pp.textContent = vid.paused ? '▶' : '⏸';
    if (sc && !scrubbing && isFinite(vid.duration) && vid.duration > 0) {
      sc.value = String(Math.round((t / vid.duration) * 1000));
    }
  }
  
  function startClock() { stopClock(); clockTimer = setInterval(updateClockNow, 40); updateClockNow(); }
  function stopClock() { if (clockTimer) { clearInterval(clockTimer); clockTimer = null; } }

  window.__scrub = function(val) {
    const { vid } = playerCtx();
    if (!vid || !isFinite(vid.duration)) return;
    scrubbing = true; vid.currentTime = (Number(val) / 1000) * vid.duration; updateClockNow();
    clearTimeout(window.__scrubT); window.__scrubT = setTimeout(() => { scrubbing = false; }, 250);
  };

  function positionStampTick(vid, v) {
    const tick = document.getElementById('stampTick');
    if (!tick) return;
    if (!v || v.releaseFileTime == null || !isFinite(vid.duration) || vid.duration <= 0) { tick.hidden = true; return; }
    tick.style.left = Math.max(0, Math.min(1, v.releaseFileTime / vid.duration)) * 100 + '%';
    tick.hidden = false;
  }

  function setReady(ready) {
    const overlay = document.getElementById('vidLoading');
    const markBtn = document.getElementById('markBtn');
    if (overlay && ready) overlay.style.display = 'none'; 
    if (markBtn) markBtn.disabled = !ready;
    document.querySelectorAll('.transport .tbtn').forEach(b => { b.disabled = !ready; });
  }

  function attachVideoEvents() {
    const vid = document.getElementById('vid');
    if (!vid) return;
    const applySpeed = () => { vid.playbackRate = state.speed || 1; };
    applySpeed();
    const v0 = currentVideo();
    
    const onMeta = () => {
      applySpeed();
      if (v0 && v0.stampFrame != null && v0.frameCount && isFinite(vid.duration) && vid.duration > 0) {
        v0.fps = v0.frameCount / vid.duration; v0.fpsMeasured = true;
        v0.releaseFileTime = v0.stampFrame / v0.fps;
      }
      positionStampTick(vid, v0);
      // Removed the code that auto-jumped the video here. It naturally starts at 0.
    };
    
    vid.addEventListener('loadedmetadata', onMeta);
    
    const ready = () => { setReady(true); applySpeed(); document.getElementById('vidLoading').style.display = 'none'; };
    
    vid.addEventListener('canplay', ready); 
    vid.addEventListener('loadeddata', () => { if (vid.readyState >= 2) ready(); });
    vid.addEventListener('playing', ready);
    vid.addEventListener('waiting', () => { document.getElementById('vidLoading').style.display = 'flex'; });
    vid.addEventListener('seeked', updateClockNow);
    vid.addEventListener('play', updateClockNow);
    vid.addEventListener('pause', updateClockNow);
    
    vid.addEventListener('error', () => {
      const overlay = document.getElementById('vidLoading');
      if (overlay) { overlay.textContent = 'Failed to load media.'; overlay.style.display = 'flex'; }
    });
    
    if (vid.readyState >= 2) ready();
    vid.load();
  }

  function togglePlay() {
    const { vid } = playerCtx();
    if (!vid) return;
    if (vid.paused) vid.play().catch(() => {}); else vid.pause();
    updateClockNow();
  }
  function stepFrames(n) {
    const { vid, fps } = playerCtx();
    if (!vid) return;
    vid.pause();
    const target = Math.min(Math.max(0, frameOf(vid.currentTime, fps) + n), isFinite(vid.duration) ? Math.max(0, Math.ceil(vid.duration * fps) - 1) : Infinity);
    vid.currentTime = (target + 0.5) / fps;
    updateClockNow();
  }

  function openVideo(index) {
    state.vidIndex = index; state.marked = null; state.msg = ''; state.err = ''; state.view = 'player';
  }

  /* ---------- Actions router ---------- */
  window.__act = async function(act, id) {
    state.msg = ''; state.err = '';

    if (act === 'theme') return toggleTheme();
    if (act === 'export') return exportCsv();

    if (act === 'login') {
      const name = document.getElementById('f-name').value.trim();
      const status = document.getElementById('f-status').value;
      const age = document.getElementById('f-age').value;
      if (!name || !status) { state.err = 'Name and clinical role are required.'; return render(); }
      state.user = { name, status, age }; state.view = 'collections'; return render();
    }
    if (act === 'logout') {
      state.user = null; state.view = 'login'; state.col = null; state.vidIndex = 0; state.marked = null;
      try { localStorage.removeItem(SESSION_KEY); } catch {} return render();
    }
    if (act === 'opencol') { state.col = id; state.view = 'videos'; return render(); }
    if (act === 'backcols') { state.view = 'collections'; state.col = null; return render(); }
    if (act === 'openvid') { openVideo(Number(id)); return render(); }

    if (act === 'playpause') { togglePlay(); return; }
    if (act === 'stepback')  { stepFrames(-1); return; }
    if (act === 'stepfwd')   { stepFrames(1);  return; }
    if (act === 'speed') {
      state.speed = Number(id) || 1; const { vid } = playerCtx(); if (vid) vid.playbackRate = state.speed;
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', b.textContent === (state.speed === 1 ? '1.0×' : state.speed + '×')));
      return;
    }

    if (act === 'mark') {
      const vidEl = document.getElementById('vid');
      if (!vidEl || vidEl.currentTime <= 0) { state.err = 'Please play the clip before marking.'; return render(); }
      vidEl.pause();
      const v = currentVideo();
      if (v && v.stampFrame != null && v.fps && frameInFile(v, vidEl.currentTime) < v.stampFrame) {
        state.err = `Marking too early. Wait until the pressure is released.`;
        return render();
      }
      state.marked = vidEl.currentTime; updateClockNow(); return renderActionZone();
    }
    
    if (act === 'remark') { 
      state.marked = null; 
      const { vid } = playerCtx();
      if (vid) {
        vid.currentTime = 0; // RESTART FROM BEGINNING
        vid.play().catch(() => {}); // AUTO-PLAY
      }
      updateClockNow();
      return renderActionZone(); 
    }

    if (act === 'submit') {
      if (state.saving) return;
      const col = COLLECTIONS.find(c => c.id === state.col);
      const v = col.videos[state.vidIndex];
      const fps = Number(v.fps) || 30;
      const goNext = () => {
        const hasNext = state.vidIndex < col.videos.length - 1;
        if (hasNext) { openVideo(state.vidIndex + 1); }
        else { state.view = 'videos'; state.marked = null; state.msg = 'Dataset assessment complete.'; }
        return render();
      };

      if (state.marked == null) return goNext();

      const crt = crtAt(v, state.marked);
      const payload = {
        name: state.user.name, status: state.user.status, age: state.user.age, collection: col.name,
        videoIndex: state.vidIndex + 1, videoTitle: v.title, videoId: v.videoId || null,
        timeSeconds: crt != null ? Number(Math.max(0, crt).toFixed(3)) : Number(state.marked.toFixed(3)),
        crtSeconds: crt != null ? Number(Math.max(0, crt).toFixed(3)) : '',
        rawTimeSeconds: Number(state.marked.toFixed(3)), stampTimeSeconds: v.releaseFileTime != null ? Number(v.releaseFileTime.toFixed(3)) : '',
        fps: v.realFps != null ? Number(v.realFps.toFixed(3)) : fps, frameIndex: frameInFile(v, state.marked),
        stampFrame: v.stampFrame != null ? v.stampFrame : '', submittedAt: new Date().toISOString()
      };
      
      const rec = { ...payload, synced: false };
      annotations.push(rec); saveAnnotations();
      
      state.saving = true; renderActionZone();
      try { await saveToExcel(payload); rec.synced = true; saveAnnotations(); } catch (e) {}
      state.saving = false; return goNext();
    }

    if (act === 'retrysync') { await flushQueue(); return render(); }
  };

  async function flushQueue() {
    const pending = annotations.filter(a => a.synced === false);
    for (const a of pending) { try { await saveToExcel(a); a.synced = true; } catch { break; } }
    saveAnnotations();
  }

  async function discoverAll() {
    let cols = [], vids = [];
    try {
      const [colRes, vidRes] = await Promise.all([
        fetch(`${REST_URL}/collections?select=*&order=sort_order`, { headers: SUPA_HEADERS, cache: 'no-store' }),
        fetch(`${REST_URL}/videos?select=*&order=collection_id,video_number`, { headers: SUPA_HEADERS, cache: 'no-store' })
      ]);
      if (colRes.ok) cols = await colRes.json();
      if (vidRes.ok) vids = await vidRes.json();
    } catch {}

    const built = [];
    for (const c of cols) {
      const clips = vids.filter(v => v.collection_id === c.id).sort((a, b) => a.video_number - b.video_number).map(v => {
        const realFps = (v.frame_count && v.recording_duration_s) ? v.frame_count / v.recording_duration_s : (Number(v.capture_fps) || null);
        return {
          id: c.id + '-' + v.video_number, videoId: v.id, title: v.title || ('Case ' + String(v.video_number).padStart(2, '0')),
          file: v.storage_path, url: BUCKET_PUBLIC_URL + v.storage_path.split('/').map(encodeURIComponent).join('/'),
          fps: Number(FPS_OVERRIDES[v.storage_path]) || Number(v.encoded_fps) || DEFAULT_FPS,
          realFps: realFps, stampFrame: v.stamped_frame != null ? v.stamped_frame : null,
          frameCount: v.frame_count != null ? v.frame_count : null
        };
      });
      if (clips.length) built.push({ id: c.id, name: c.name, icon: c.icon || '📁', videos: clips });
    }

    if (built.length) COLLECTIONS = built; else if (!COLLECTIONS.length) COLLECTIONS = MANUAL_COLLECTIONS.map(c => ({ ...c }));
    const activeCol = COLLECTIONS.find(c => c.id === state.col);
    if (state.col && !activeCol) { state.view = state.user ? 'collections' : 'login'; state.col = null; state.vidIndex = 0; }
    else if (activeCol) { if (state.vidIndex < 0 || state.vidIndex >= activeCol.videos.length) state.vidIndex = 0; }
    render();
  }

  render();
  discoverAll();
  flushQueue().then(() => render());
})();
</script>
</body>
</html>
