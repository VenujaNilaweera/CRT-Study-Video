<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E2A2F">
<title>CRT Perception Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Apply saved theme before first paint (no flash of wrong theme).
  (() => {
    try {
      const t = localStorage.getItem('crt-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch {}
  })();
</script>
</head>
<body>
<div class="hdr">
  <div class="brand">
    <div class="dot"></div>
    <div>
      <h1>CRT Perception Study</h1>
      <div class="sub">capillary refill · color-change timing</div>
    </div>
  </div>
  <div class="actions" id="hdrActions"></div>
</div>

<div class="wrap" id="app"></div>

<script>
/* =========================================================================
   VIDEO LIBRARY

   The app AUTO-DISCOVERS every video sitting in the folders listed in
   VIDEO_FOLDERS below. Just drop .mp4 clips into "videos/" (next to this
   file) and reload — they appear automatically, no code editing needed.

   Serve the folder over http (e.g.  python -m http.server 8899 ) so the
   browser can both list the folder and load the clips.

   Want several separate folders/collections? Add more entries to
   VIDEO_FOLDERS, each with its own on-disk path and display name.

   fps defaults to 30 (used to turn the marked time into a frame number).
   If some clips run at another frame rate, add an override in FPS_OVERRIDES.
   ========================================================================= */
const VIDEO_FOLDERS = [
  { id: 'col1', name: 'Collection 01', icon: '📁', path: 'videos/' }
  // { id: 'col2', name: 'Collection 02', icon: '📁', path: 'videos2/' },
];

const DEFAULT_FPS = 30;
const FPS_OVERRIDES = {
  // 'somefile.mp4': 60,
};

// Optional hand-listed videos (used as a fallback if folder listing is blocked,
// e.g. when opening index.html directly via file://). Same shape as before:
// { id, title, url, fps }
const MANUAL_COLLECTIONS = [];

// Populated at runtime from VIDEO_FOLDERS (falls back to MANUAL_COLLECTIONS).
let COLLECTIONS = MANUAL_COLLECTIONS.map(c => ({ ...c }));

const STORAGE_KEY = 'crt-study-annotations';
const SESSION_KEY = 'crt-study-session';
const THEME_KEY = 'crt-theme';
// Save to the SAME host the page was opened from, on the helper's port (8787).
// This way a phone that opens http://<pc-ip>:8899 saves to the PC's helper,
// not to the phone's own localhost. Falls back to 127.0.0.1 for file:// opens.
const EXCEL_HELPER_URL = `http://${location.hostname || '127.0.0.1'}:8787/annotation`;
</script>

<script>
(() => {
  const app = document.getElementById('app');
  const hdrActions = document.getElementById('hdrActions');
  let state = { view: 'login', user: null, col: null, vidIndex: 0, marked: null, saving: false, msg: '', err: '' };
  restoreSession();               // survive page reloads (e.g. live-reload servers, accidental refresh)
  let annotations = loadAnnotations();

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = t => {
    if (t == null) return '--:--.--';
    const m = Math.floor(t / 60), s = t % 60;
    return String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0');
  };
  const frameOf = (t, fps) => Math.round(t * (Number(fps) || 30));
  const csvCell = value => `"${String(value ?? '').replaceAll('"', '""')}"`;

  /* ---------- persistence ---------- */
  function loadAnnotations() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch { return []; }
  }
  function saveAnnotations() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(annotations));
  }

  /* ---------- session (login + position) survives a page reload ---------- */
  function saveSession() {
    try {
      if (!state.user) { localStorage.removeItem(SESSION_KEY); return; }
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        user: state.user,
        view: state.view === 'login' ? 'collections' : state.view,
        col: state.col,
        vidIndex: state.vidIndex
      }));
    } catch {}
  }
  function restoreSession() {
    try {
      const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      if (s && s.user && s.user.name) {
        state.user = s.user;
        state.view = s.view || 'collections';
        state.col = s.col ?? null;
        state.vidIndex = Number.isInteger(s.vidIndex) ? s.vidIndex : 0;
        // marked/saving/messages always start clean after a reload.
        state.marked = null; state.saving = false; state.msg = ''; state.err = '';
      }
    } catch {}
  }
  // Has THIS user already annotated a given collection+video?
  function isDone(colName, videoIndex) {
    if (!state.user) return false;
    return annotations.some(a =>
      a.name === state.user.name &&
      a.collection === colName &&
      a.videoIndex === videoIndex);
  }
  function doneCount(col) {
    return col.videos.reduce((n, _v, i) => n + (isDone(col.name, i + 1) ? 1 : 0), 0);
  }

  /* ---------- theme ---------- */
  function currentTheme() {
    const set = document.documentElement.getAttribute('data-theme');
    if (set) return set;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function toggleTheme() {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch {}
    render();
  }

  /* ---------- CSV export ---------- */
  function exportCsv() {
    const header = ['name', 'status', 'age', 'collection', 'videoIndex', 'videoTitle', 'timeSeconds', 'fps', 'frameIndex', 'submittedAt'];
    const rows = [header.join(',')];
    for (const row of annotations) {
      rows.push([
        csvCell(row.name), csvCell(row.status), csvCell(row.age), csvCell(row.collection),
        csvCell(row.videoIndex), csvCell(row.videoTitle), csvCell(row.timeSeconds),
        csvCell(row.fps), csvCell(row.frameIndex), csvCell(row.submittedAt),
      ].join(','));
    }
    const blob = new Blob([rows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'crt-study-annotations.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  async function saveToExcel(payload) {
    const response = await fetch(EXCEL_HELPER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok || !result.ok) {
      throw new Error(result.error || 'Excel helper did not save the annotation.');
    }
    return result;
  }

  /* ---------- render ---------- */
  function render() {
    saveSession();
    document.body.dataset.view = state.view;
    const themeIcon = currentTheme() === 'dark' ? '☀️' : '🌙';
    let actions = `<button class="icon-btn square" title="Toggle theme" onclick="window.__act('theme')">${themeIcon}</button>`;
    if (state.user) {
      actions += `<span class="who">${esc(state.user.name)} · ${esc(state.user.status)}</span>`;
      if (annotations.length) actions += `<button onclick="window.__act('export')">Export log</button>`;
      actions += `<button onclick="window.__act('logout')">Log out</button>`;
    }
    hdrActions.innerHTML = actions;

    let html = '';
    if (state.view === 'login') html = viewLogin();
    else if (state.view === 'collections') html = viewCollections();
    else if (state.view === 'videos') html = viewVideos();
    else if (state.view === 'player') html = viewPlayer();
    app.innerHTML = html;

    if (state.view === 'player') startClock(); else stopClock();
  }

  function viewLogin() {
    return `<div class="card" style="max-width:460px;margin:12px auto;">
      <div class="page-head">
        <h2>Join the study</h2>
        <p class="muted">Watch short capillary-refill clips and press one button the moment you see the skin colour return.</p>
      </div>
      <div class="field"><label>Full name</label><input id="f-name" placeholder="e.g. A. Perera" autocomplete="name"></div>
      <div class="field"><label>Status / role</label>
        <select id="f-status"><option value="">Select…</option><option>Nurse</option><option>Doctor</option><option>Medical student</option><option>Paramedic</option><option>Researcher</option><option>Other</option></select></div>
      <div class="field"><label>Age group</label>
        <select id="f-age"><option value="">Select…</option><option>18-24</option><option>25-34</option><option>35-44</option><option>45-54</option><option>55+</option></select></div>
      <button class="btn block" onclick="window.__act('login')">Start</button>
      ${state.err ? `<div class="err">${esc(state.err)}</div>` : ''}
    </div>`;
  }

  function viewCollections() {
    const items = COLLECTIONS.map(c => {
      const done = doneCount(c);
      return `<button class="tile" onclick="window.__act('opencol','${c.id}')">
        <div class="row">
          <div class="thumb">${c.icon || '📁'}</div>
          <span class="badge ${done === c.videos.length && c.videos.length ? 'done' : ''}">${done}/${c.videos.length} done</span>
        </div>
        <div>
          <div class="t">${esc(c.name)}</div>
          <div class="m">${c.videos.length} video${c.videos.length !== 1 ? 's' : ''}</div>
        </div>
      </button>`;
    }).join('');
    return `<div class="page-head"><h2>Collections</h2><p class="muted">Pick a folder to see its videos.</p></div>
      ${items ? `<div class="grid">${items}</div>` : '<div class="card muted">No collections yet.</div>'}`;
  }

  function viewVideos() {
    const col = COLLECTIONS.find(c => c.id === state.col);
    if (!col) return `<div class="card muted">Loading videos…</div>`;
    const done = doneCount(col);
    const items = col.videos.map((v, i) => {
      const d = isDone(col.name, i + 1);
      return `<div class="vid-row" onclick="window.__act('openvid',${i})">
        <div class="num">${String(i + 1).padStart(2, '0')}</div>
        <div class="info">
          <div class="t">${esc(v.title)}</div>
          <div class="m">${esc(v.file || '')}${v.file ? ' · ' : ''}${v.fps || 30} fps</div>
        </div>
        <span class="badge ${d ? 'done' : 'todo'}">${d ? '✓ Done' : 'Watch'}</span>
      </div>`;
    }).join('');
    return `<div class="crumb"><a onclick="window.__act('backcols')">Collections</a><span>/</span><span>${esc(col.name)}</span></div>
      <div class="page-head" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <h2>${esc(col.name)}</h2>
        <span class="progress-pill">${done} of ${col.videos.length} annotated</span>
      </div>
      ${items || '<div class="card muted">No videos in this collection.</div>'}`;
  }

  function viewPlayer() {
    const col = COLLECTIONS.find(c => c.id === state.col);
    if (!col || !col.videos[state.vidIndex]) return `<div class="card muted">Loading video…</div>`;
    const v = col.videos[state.vidIndex];
    const total = col.videos.length;
    const current = state.vidIndex + 1;
    const fps = Number(v.fps) || 30;
    const hasPrev = state.vidIndex > 0;
    const hasNext = state.vidIndex < total - 1;
    const done = isDone(col.name, current);

    return `<div class="crumb">
        <a onclick="window.__act('backcols')">Collections</a><span>/</span>
        <a onclick="window.__act('opencol','${col.id}')">${esc(col.name)}</a><span>/</span>
        <span>${esc(v.title)}</span>
      </div>
      <div class="page-head" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <h2>${esc(v.title)}</h2>
        <span class="progress-pill">Video ${current} of ${total}${done ? ' · ✓ annotated' : ''}</span>
      </div>
      <div class="player-layout">
        <div class="video-panel">
          <video id="vid" src="${esc(v.url)}" controls playsinline preload="metadata"></video>
          <div class="nav-row">
            <button class="btn neutral" onclick="window.__act('prev')" ${hasPrev ? '' : 'disabled'}>‹ Previous</button>
            <button class="btn neutral" onclick="window.__act('restart')">↺ Restart clip</button>
            <button class="btn neutral" onclick="window.__act('next')" ${hasNext ? '' : 'disabled'}>Next ›</button>
          </div>
        </div>
        <div class="control-panel">
          <div class="readout">
            <div class="clock">
              <span class="lbl">Video time</span>
              <span class="val" id="clock">00:00.00</span>
              <span class="frame" id="frame">frame 0 · ${fps} fps</span>
            </div>
            <button class="mark-btn" onclick="window.__act('mark')">● Mark colour change</button>
          </div>
          ${state.marked != null ? `
            <div class="marked">
              <div class="headline">You marked the colour change at</div>
              <div><span class="mt">${fmt(state.marked)}</span></div>
              <div class="meta">${state.marked.toFixed(3)} s · frame ${frameOf(state.marked, fps)}</div>
              <div class="actions">
                <button class="btn ghost small" onclick="window.__act('remark')">↺ Retry</button>
                <button class="btn small" onclick="window.__act('submit')" ${state.saving ? 'disabled' : ''}>${state.saving ? 'Saving…' : (hasNext ? 'Save & Next ›' : 'Save & Finish')}</button>
              </div>
            </div>` : `<div class="hint">Play the video, then press the red button the instant you perceive the colour returning. You can retry as many times as you like before saving.</div>`}
          ${state.msg ? `<div class="ok">${esc(state.msg)}</div>` : ''}
          ${state.err ? `<div class="err">${esc(state.err)}</div>` : ''}
        </div>
      </div>`;
  }

  /* ---------- live clock ---------- */
  let clockTimer = null;
  function startClock() {
    stopClock();
    const col = COLLECTIONS.find(c => c.id === state.col);
    const fps = Number(col?.videos[state.vidIndex]?.fps) || 30;
    clockTimer = setInterval(() => {
      const vid = document.getElementById('vid');
      const c = document.getElementById('clock');
      const f = document.getElementById('frame');
      if (vid && c) c.textContent = fmt(vid.currentTime);
      if (vid && f) f.textContent = `frame ${frameOf(vid.currentTime, fps)} · ${fps} fps`;
    }, 40);
  }
  function stopClock() {
    if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
  }

  function openVideo(index) {
    state.vidIndex = index;
    state.marked = null;
    state.msg = '';
    state.err = '';
    state.view = 'player';
  }

  /* ---------- actions ---------- */
  window.__act = async function(act, id) {
    state.msg = ''; state.err = '';

    if (act === 'theme') return toggleTheme();
    if (act === 'export') return exportCsv();

    if (act === 'login') {
      const name = document.getElementById('f-name').value.trim();
      const status = document.getElementById('f-status').value;
      const age = document.getElementById('f-age').value;
      if (!name || !status) { state.err = 'Name and status are required.'; return render(); }
      state.user = { name, status, age };
      state.view = 'collections';
      return render();
    }
    if (act === 'logout') {
      state.user = null; state.view = 'login'; state.col = null; state.vidIndex = 0; state.marked = null;
      try { localStorage.removeItem(SESSION_KEY); } catch {}
      return render();
    }
    if (act === 'opencol') { state.col = id; state.view = 'videos'; return render(); }
    if (act === 'backcols') { state.view = 'collections'; state.col = null; return render(); }
    if (act === 'openvid') { openVideo(Number(id)); return render(); }

    if (act === 'prev') { if (state.vidIndex > 0) openVideo(state.vidIndex - 1); return render(); }
    if (act === 'next') {
      const col = COLLECTIONS.find(c => c.id === state.col);
      if (state.vidIndex < col.videos.length - 1) openVideo(state.vidIndex + 1);
      return render();
    }
    if (act === 'restart') {
      const vid = document.getElementById('vid');
      if (vid) { vid.currentTime = 0; vid.play().catch(() => {}); }
      return;
    }

    if (act === 'mark') {
      const vidEl = document.getElementById('vid');
      if (!vidEl || vidEl.currentTime <= 0) { state.err = 'Play the video first, then mark.'; return render(); }
      state.marked = vidEl.currentTime;
      return render();
    }
    if (act === 'remark') { state.marked = null; return render(); }

    if (act === 'submit') {
      const col = COLLECTIONS.find(c => c.id === state.col);
      const v = col.videos[state.vidIndex];
      const fps = Number(v.fps) || 30;
      const payload = {
        name: state.user.name,
        status: state.user.status,
        age: state.user.age,
        collection: col.name,
        videoIndex: state.vidIndex + 1,
        videoTitle: v.title,
        timeSeconds: Number(state.marked.toFixed(3)),
        fps,
        frameIndex: frameOf(state.marked, fps),
        submittedAt: new Date().toISOString()
      };
      state.saving = true; render();
      try {
        await saveToExcel(payload);
        annotations.push(payload);
        saveAnnotations();
        state.saving = false;
        const hasNext = state.vidIndex < col.videos.length - 1;
        if (hasNext) {
          openVideo(state.vidIndex + 1);
          state.msg = 'Saved to data.xlsx. Moving to the next video.';
        } else {
          state.view = 'videos';
          state.marked = null;
          state.msg = 'Saved to data.xlsx. Collection complete — thank you!';
        }
      } catch (e) {
        state.saving = false;
        state.err = 'Could not update data.xlsx. Start excel_helper.py, then try Save again. ' + e.message;
      }
      return render();
    }
  };

  // Re-render on system theme change when the user hasn't pinned a theme.
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => {
      if (!document.documentElement.getAttribute('data-theme')) render();
    });
  }

  /* ---------- auto-discover videos in the configured folders ---------- */
  const VIDEO_EXT = /\.(mp4|webm|ogg|ogv|mov|m4v)$/i;
  async function discoverFolder(folder) {
    try {
      const res = await fetch(folder.path, { cache: 'no-store' });
      if (!res.ok) return null;
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const names = [...doc.querySelectorAll('a')]
        .map(a => a.getAttribute('href') || '')
        .filter(h => VIDEO_EXT.test(h))
        .map(h => decodeURIComponent(h.split('/').pop().split('?')[0]));
      const uniq = [...new Set(names)].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      if (!uniq.length) return null;
      const base = folder.path.endsWith('/') ? folder.path : folder.path + '/';
      return uniq.map((name, i) => ({
        id: folder.id + '-' + i,
        title: 'CRT Test ' + String(i + 1).padStart(2, '0'),
        file: name,
        url: base + encodeURIComponent(name),
        fps: Number(FPS_OVERRIDES[name]) || DEFAULT_FPS
      }));
    } catch { return null; }
  }

  async function discoverAll() {
    const built = [];
    for (const folder of VIDEO_FOLDERS) {
      const videos = await discoverFolder(folder);
      if (videos && videos.length) {
        built.push({ id: folder.id, name: folder.name, icon: folder.icon || '📁', videos });
      }
    }
    if (built.length) {
      COLLECTIONS = built;
    } else if (!COLLECTIONS.length) {
      COLLECTIONS = MANUAL_COLLECTIONS.map(c => ({ ...c }));
    }
    // Keep the user on a valid screen if their current collection vanished.
    const activeCol = COLLECTIONS.find(c => c.id === state.col);
    if (state.col && !activeCol) {
      state.view = state.user ? 'collections' : 'login';
      state.col = null;
      state.vidIndex = 0;
    } else if (activeCol) {
      // Clamp a restored video index to the collection's real length.
      if (state.vidIndex < 0 || state.vidIndex >= activeCol.videos.length) state.vidIndex = 0;
    }
    // A restored player/videos view with no valid collection falls back gracefully.
    if ((state.view === 'player' || state.view === 'videos') && !COLLECTIONS.find(c => c.id === state.col)) {
      state.view = state.user ? 'collections' : 'login';
    }
    render();
  }

  render();
  discoverAll();
})();
</script>
</body>
</html>
