<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E2A2F">
<title>Capillary Refill Time (CRT) Visual Assessment Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<!-- ?v= is bumped on every styles.css change. Without it a browser can pair
     NEW html with a CACHED old stylesheet, which renders the page unstyled. -->
<link rel="stylesheet" href="styles.css?v=14">
<script>
  // Dark is the DEFAULT for this study - clips are judged on subtle skin
  // colour change, and a dark surround keeps the eye adapted and stops the
  // page glare from shifting how the video reads. Light is available, but
  // only when the viewer picks it. Applied before first paint (no flash).
  (() => {
    let t = null;
    try { t = localStorage.getItem('crt-theme'); } catch {}
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
  })();
</script>
</head>
<body>
<div class="hdr">
  <div class="brand">
    <div class="dot"></div>
    <div>
      <h1>Capillary Refill Time (CRT) Study</h1>
      <div class="sub">visual assessment · colour-change timing</div>
    </div>
  </div>
  <div class="actions" id="hdrActions"></div>
</div>

<div class="wrap" id="app"></div>

<script>
/* =========================================================================
   VIDEO LIBRARY

   Videos, collections, and their stamp metadata now come from Supabase
   (see the SUPABASE BACKEND block below). To add clips: upload the .mp4 to
   the Storage bucket and insert a matching row in the `videos` table — the
   app picks them up on the next reload. Nothing to edit here.

   fps defaults to 30 (used to turn the marked time into a frame number).
   If some clips run at another frame rate, add an override in FPS_OVERRIDES
   keyed by the video's storage_path.
   ========================================================================= */
//edededeeded
const DEFAULT_FPS = 30;
const FPS_OVERRIDES = {
  // 'somefile.mp4': 60,
};

// Optional hand-listed videos (used as a fallback if folder listing is blocked,
// e.g. when opening index.html directly via file://). Same shape as before:
// { id, title, url, fps }
const MANUAL_COLLECTIONS = [];

// Populated at runtime from Supabase (falls back to MANUAL_COLLECTIONS).
let COLLECTIONS = MANUAL_COLLECTIONS.map(c => ({ ...c }));

const STORAGE_KEY = 'crt-study-annotations';
const SESSION_KEY = 'crt-study-session';
const THEME_KEY = 'crt-theme';
const INTRO_KEY = 'crt-intro-seen';   // login intro animation plays once per browser
const ONBOARD_KEY = 'crt-onboarding-seen';   // names that have finished the walkthrough

/* =========================================================================
   SUPABASE BACKEND

   Videos + their stamp metadata are read from the `videos` table.
   The .mp4 files themselves are served from the public Storage bucket.
   Annotations are written directly into the `annotations` table.
   No Python helper and no local videos/ folder are needed anymore.
   ========================================================================= */
const SUPABASE_URL = 'https://nsmdjwgurzoyfkxatgzz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WSs9V5v6MUMCFtXJyF3opg_KkQGypYr';
const STORAGE_BUCKET = 'vids';
// Public URL prefix for objects in the bucket.
const BUCKET_PUBLIC_URL = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/`;
// REST endpoints.
const REST_URL = `${SUPABASE_URL}/rest/v1`;
const SUPA_HEADERS = {
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
  'Content-Type': 'application/json'
};
</script>

<script>
(() => {
  const app = document.getElementById('app');
  const hdrActions = document.getElementById('hdrActions');
  let state = {
    view: 'login', user: null, marked: null, saving: false, msg: '', err: '', speed: 1,
    onboardPage: 0,
    libraryError: '',    // why the clip library is empty, if it is
    orderSeed: null,     // seeds the tie-break shuffle in the serving queue
    queue: [],           // this participant's clips, in the order they'll see them
    qIndex: 0,           // how far along that queue they are
    queueReady: false
  };
  let prevView = null;            // drives the login typing replay
  restoreSession();               // survive page reloads (e.g. live-reload servers, accidental refresh)
  let annotations = loadAnnotations();

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = t => {
    if (t == null) return '--:--.--';
    const m = Math.floor(t / 60), s = t % 60;
    return String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0');
  };
  // The frame CONTAINING time t is floor(t*fps) — never round(), which would
  // report the next frame once t sits past a frame's midpoint.
  const frameOf = (t, fps) => Math.floor(t * (Number(fps) || 30) + 1e-6);

  /* ---------- persistence ---------- */
  function loadAnnotations() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch { return []; }
  }
  function saveAnnotations() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(annotations));
  }

  /* ---------- session (login + position) survives a page reload ---------- */
  function saveSession() {
    try {
      if (!state.user) { localStorage.removeItem(SESSION_KEY); return; }
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        user: state.user,
        // The queue is rebuilt from scratch on every load (it has to be — the
        // set of clips this person has already marked may have grown), so only
        // who they are and their draw order are worth keeping.
        orderSeed: state.orderSeed
      }));
    } catch {}
  }
  function restoreSession() {
    try {
      const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      if (s && s.user && s.user.name) {
        state.user = s.user;
        // Hold on the "preparing" card until the rebuilt queue arrives.
        state.view = 'loading';
        // Reuse the saved order so a refresh doesn't redraw a different one; a
        // session saved before this feature existed just gets one now.
        state.orderSeed = Number.isFinite(s.orderSeed) ? s.orderSeed : newOrderSeed();
        // marked/saving/messages always start clean after a reload.
        state.marked = null; state.saving = false; state.msg = ''; state.err = '';
        // A restored session skips the login screen, so the sign-in check
        // never runs for it — repeat the same per-name test here.
        if (!hasOnboarded(state.user.name)) { state.view = 'onboarding'; state.onboardPage = 0; }
      }
    } catch {}
  }
  /* ---------- who has seen the walkthrough ----------
     Gated per PARTICIPANT, not per browser. Several people share one phone in
     a ward, so a single "seen it" flag meant only the first of them ever got
     the explanation. Names are matched case- and space-insensitively; the old
     boolean flag parses to a non-array and is simply ignored, which shows the
     walkthrough again once — the safer way round. */
  function onboardedNames() {
    try {
      const raw = JSON.parse(localStorage.getItem(ONBOARD_KEY) || '[]');
      return Array.isArray(raw) ? raw : [];
    } catch { return []; }
  }
  const nameKey = n => String(n || '').trim().toLowerCase();
  function hasOnboarded(name) {
    const k = nameKey(name);
    return !!k && onboardedNames().includes(k);
  }
  function markOnboarded(name) {
    const k = nameKey(name);
    if (!k) return;
    const list = onboardedNames();
    if (list.includes(k)) return;
    list.push(k);
    // Keep the record from growing without bound on a shared device.
    try { localStorage.setItem(ONBOARD_KEY, JSON.stringify(list.slice(-200))); } catch {}
  }

  /* ---------- per-participant running order ----------
     With one fixed order, every participant annotates the same opening clips
     and the later ones collect almost nothing. Each sign-in draws a seed that
     shuffles BOTH the collections and the clips inside them, so one viewer
     opens on Collection 01, the next on Collection 03, and the workload
     spreads across the whole library. The seed is saved with the session, so
     a reload keeps the order steady mid-study; signing in again draws a fresh
     one. Marks are tied to clip ids (see isDone), so reordering never
     disturbs anything already recorded. */
  function newOrderSeed() {
    return Math.floor(Math.random() * 4294967296) >>> 0;
  }
  // mulberry32: tiny deterministic PRNG — one seed always yields one order.
  function seededRandom(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(list, rand) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {          // Fisher-Yates
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  /* ---------- the serving queue ----------
     Participants no longer pick a collection; the app hands them clips one
     after another. The order is chosen to even out coverage:

       1. drop every clip this person has already marked (never repeat one),
       2. sort what is left by how many marks each clip already carries,
          fewest first, so the quietest clips get served before the busy ones,
       3. shuffle WITHIN each equal-count tier, so two people signing in at
          the same moment aren't handed the identical clip.

     `times_annotated` comes from the videos table (see supabase_balancing.sql).
     If that column isn't there yet every clip reads as zero, the whole library
     lands in one tier, and step 3 alone still scatters people across it. */
  const SET_SIZE = 10;          // clips per run before we offer a breather
  let POOL = [];                // every clip, flat, exactly as fetched
  let discovery = null;         // resolves once the library has been loaded

  function buildQueue(seenIds) {
    const rand = seededRandom(state.orderSeed ?? newOrderSeed());
    const tiers = new Map();
    for (const v of POOL) {
      if (v.videoId && seenIds.has(v.videoId)) continue;      // already marked
      const n = Number(v.timesAnnotated) || 0;
      if (!tiers.has(n)) tiers.set(n, []);
      tiers.get(n).push(v);
    }
    const out = [];
    for (const n of [...tiers.keys()].sort((a, b) => a - b)) {
      out.push(...shuffled(tiers.get(n), rand));
    }
    return out;
  }

  /* Everything this participant has already marked — the browser's own record
     merged with the server's. Local alone would forget on a new phone or a
     cleared cache and start showing old clips again. */
  async function fetchSeen(name) {
    const ids = new Set();
    for (const a of annotations) {
      if (a.name === name && a.videoId) ids.add(a.videoId);
    }
    try {
      const res = await fetch(`${REST_URL}/rpc/crt_seen_videos`, {
        method: 'POST',
        headers: SUPA_HEADERS,
        body: JSON.stringify({ p_name: name })
      });
      if (res.ok) {
        for (const row of await res.json()) {
          const id = (row && row.video_id) || row;
          if (id) ids.add(id);
        }
      }
    } catch { /* helper not installed, or offline — the local record stands */ }
    return ids;
  }

  async function prepareQueue() {
    try { await discovery; } catch {}
    const seen = state.user ? await fetchSeen(state.user.name) : new Set();
    state.queue = buildQueue(seen);
    state.qIndex = 0;
    state.queueReady = true;
  }

  const currentClip = () => (state.queue && state.queue[state.qIndex]) || null;
  /* Step to the next clip in the queue. At a set boundary the run pauses on the
     "set complete" screen instead of rolling straight on; once the queue is
     exhausted there is nothing left to mark. Used both after a saved mark and
     by the plain "Skip clip" button, so the two can never drift apart. */
  function advanceQueue() {
    state.qIndex += 1;
    state.marked = null; state.msg = ''; state.err = '';
    if (state.qIndex >= state.queue.length) state.view = noClipView();
    else if (state.qIndex % SET_SIZE === 0) state.view = 'setdone';
    else state.view = 'player';
    return render();
  }
  /* Where to go when there is no clip to show. "All done" is only honest if
     the library actually loaded and this person has worked through it; if the
     library itself is empty or unreachable, that is a fault to report, not a
     finish line to congratulate someone on. */
  const noClipView = () => (POOL.length ? 'finished' : 'nolibrary');
  const nextView = () => (currentClip() ? 'player' : noClipView());
  // How far through the current run of SET_SIZE they are.
  const setDone = () => state.qIndex % SET_SIZE;
  const setNumber = () => Math.floor(state.qIndex / SET_SIZE) + 1;
  // Clips left in this run — a final short set is normal near the end.
  const setTotal = () => Math.min(SET_SIZE, state.queue.length - (setNumber() - 1) * SET_SIZE);

  /* ---------- icons ----------
     Inline SVG rather than emoji: emoji render differently on every platform
     (and often in full colour), which fights the palette and looks unlike a
     clinical tool. These are stroke icons that inherit currentColor, so they
     stay correct in both themes at any size. */
  const ICON = {
    sun:   '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon:  '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
    down:  '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
    retry: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
    back:  '<path d="m15 18-6-6 6-6"/>',
    fwd:   '<path d="m9 18 6-6-6-6"/>',
    folder:'<path d="M4 20a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4.9a2 2 0 0 1 1.7.9l.9 1.4a2 2 0 0 0 1.7.9H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2z"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    dot:   '<circle cx="12" cy="12" r="7" fill="currentColor" stroke="none"/>',
  };
  // size: px. Stroke width scales down a little on big icons so weight looks even.
  function icon(name, size = 17) {
    const d = ICON[name];
    if (!d) return '';
    return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" `
         + `fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" `
         + `stroke-linejoin="round" aria-hidden="true" focusable="false">${d}</svg>`;
  }

  /* ---------- theme ---------- */
  function currentTheme() {
    // Dark unless the viewer has explicitly switched to light.
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  }
  function toggleTheme() {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch {}
    render();
  }

  // Skip, or reaching the last page's Start button, both end onboarding the
  // same way: gate it shut for this browser and drop into Collections.
  function finishOnboarding() {
    markOnboarded(state.user && state.user.name);
    state.onboardPage = 0;
    // Straight into the first clip — there is nothing to choose.
    state.view = state.queueReady ? nextView() : 'loading';
    return render();
  }

  // Write one annotation row into the Supabase `annotations` table.
  // Keeps the same function name so the rest of the app (queue, retry,
  // offline resilience) is untouched.
  async function saveToExcel(payload) {
    // Map the app's payload onto the annotations table columns.
    const row = {
      display_name: payload.name,
      role: payload.status,
      age_group: payload.age,
      video_id: payload.videoId || null,
      skipped: false,
      mark_file_time_s: payload.rawTimeSeconds === '' ? null : payload.rawTimeSeconds,
      frame_number: payload.frameIndex === '' ? null : payload.frameIndex,
      crt_s: payload.crtSeconds === '' ? null : payload.crtSeconds,
      fps_used: payload.fps === '' ? null : payload.fps,
      release_file_time_s: payload.stampTimeSeconds === '' ? null : payload.stampTimeSeconds,
      stamp_frame_used: payload.stampFrame === '' ? null : payload.stampFrame,
      submitted_at: payload.submittedAt
    };
    // return=minimal → Supabase won't try to SELECT the row back after
    // insert, so we don't need a public read policy on `annotations`
    // (participants can submit but never read others' marks).
    const response = await fetch(`${REST_URL}/annotations`, {
      method: 'POST',
      headers: { ...SUPA_HEADERS, 'Prefer': 'return=minimal' },
      body: JSON.stringify(row)
    });
    if (!response.ok) {
      const text = await response.text().catch(() => '');
      throw new Error(text || `Supabase rejected the annotation (${response.status}).`);
    }
    return { ok: true };
  }

  /* ---------- render ---------- */
  function render() {
    saveSession();
    document.body.dataset.view = state.view;
    const dark = currentTheme() === 'dark';
    let actions = `<button class="icon-btn square" title="Switch to ${dark ? 'light' : 'dark'} mode"
      aria-label="Switch to ${dark ? 'light' : 'dark'} mode" onclick="window.__act('theme')">${icon(dark ? 'sun' : 'moon')}</button>`;
    if (state.user) {
      actions += `<span class="who">${esc(state.user.name)} · ${esc(state.user.status)}</span>`;
      const pending = annotations.filter(a => a.synced === false).length;
      if (pending) actions += `<button class="sync-warn" title="${pending} mark(s) not yet saved — click to retry" onclick="window.__act('retrysync')">${icon('retry', 15)} ${pending} unsaved</button>`;
      actions += `<button onclick="window.__act('logout')">${icon('logout', 15)} Log out</button>`;
    }
    hdrActions.innerHTML = actions;

    let html = '';
    if (state.view === 'login') html = viewLogin();
    else if (state.view === 'onboarding') html = viewOnboarding();
    else if (state.view === 'loading') html = viewLoading();
    else if (state.view === 'setdone') html = viewSetDone();
    else if (state.view === 'finished') html = viewFinished();
    else if (state.view === 'nolibrary') html = viewLibraryUnavailable();
    else if (state.view === 'paused') html = viewPaused();
    else if (state.view === 'player') html = viewPlayer();
    app.innerHTML = html;

    if (state.view === 'player') { attachVideoEvents(); startClock(); } else stopClock();

    // Replay the typing when the viewer ARRIVES at the login screen (initial
    // load or after logging out), not on a validation re-render.
    if (state.view === 'login') {
      typeQuote(prevView !== 'login');
      try { localStorage.setItem(INTRO_KEY, '1'); } catch {}
    }
    prevView = state.view;
    primeBackTrap();
  }

  /* ---------- browser / phone Back button ----------
     This is a single page with no URL routes, so the device Back button would
     otherwise leave the site entirely from any screen — on a phone, where the
     header and breadcrumb are hidden in the player, that felt like the app
     just quit. Keep one extra history entry parked ahead of the app; when Back
     consumes it, step UP one level (player → video list → collections) and
     re-arm, so Back only leaves the site from the collections menu itself. */
  let backTrapPrimed = false;
  function primeBackTrap() {
    if (backTrapPrimed) return;
    // Only start trapping once the viewer is actually inside the app.
    if (!state.user || state.view === 'login') return;
    try { history.pushState({ crtTrap: 1 }, ''); backTrapPrimed = true; } catch {}
  }
  window.addEventListener('popstate', () => {
    if (!backTrapPrimed) return;               // trap not armed yet — let it be
    if (state.view === 'player') {
      // There is no list to climb back to any more, so Back pauses the run —
      // which is also the one place that offers a deliberate way out.
      state.marked = null; state.msg = ''; state.err = '';
      state.view = 'paused';
      stopClock(); render();
      try { history.pushState({ crtTrap: 1 }, ''); } catch {}
    } else if (state.view === 'onboarding') {
      // Don't let Back drop out of the walkthrough into a blank history slot.
      render();
      try { history.pushState({ crtTrap: 1 }, ''); } catch {}
    }
    // paused / setdone / finished / login: let Back proceed and leave the site.
  });

  // The quote types itself out on the first paint of each page load. Typing
  // is done in JS rather than a CSS steps() animation because the line wraps:
  // a width-based reveal would clip mid-word at narrow widths.
  const QUOTE = 'Two clinicians watch the same refill and read two different times.';
  // Replays every time the login screen is ENTERED - first load, and again
  // after a logout - but not on the re-render a failed validation causes,
  // which would restart the text mid-read.
  let typingRun = 0;

  function typeQuote(replay) {
    const el = document.getElementById('typed');
    if (!el) return;
    const reduce = window.matchMedia &&
                   window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!replay || reduce) {       // just a re-render, or the viewer opted out
      el.textContent = QUOTE;
      el.closest('.about-quote')?.classList.add('done');
      return;
    }
    const run = ++typingRun;       // a newer run cancels this one
    el.textContent = '';
    let i = 0;
    const tick = () => {
      if (run !== typingRun) return;                   // superseded by a newer run
      if (!document.getElementById('typed')) return;   // view changed mid-type
      el.textContent = QUOTE.slice(0, ++i);
      if (i < QUOTE.length) {
        // Slight pause after punctuation reads more like a person typing.
        const c = QUOTE[i - 1];
        setTimeout(tick, c === ',' ? 190 : c === '.' ? 260 : 26 + Math.random() * 34);
      } else {
        el.closest('.about-quote')?.classList.add('done');
      }
    };
    setTimeout(tick, 420);
  }

  function viewLogin() {
    // The intro animation plays once per browser, not on every re-render
    // (a failed validation re-renders this view and replaying it would nag).
    let seen = false;
    try { seen = localStorage.getItem(INTRO_KEY) === '1'; } catch {}
    const anim = seen ? '' : ' intro';

    return `<div class="login-layout${anim}">
      <!-- Reading order is fixed: the study is NAMED first, then explained in
           two lines, and only then are any details asked for. The hero spans
           both columns so that order holds on a wide screen too, where the
           form and the panel sit side by side. -->
      <header class="study-hero">
        <span class="hero-eyebrow">Research study</span>
        <h2 class="hero-title">Capillary Refill Time (CRT) Visual Assessment Study</h2>
        <p class="hero-lede">This study investigates how people judge capillary refill by eye. You will
        watch short clips of a nail bed being pressed and released, and mark the moment you see the
        colour return — your marks measure how much that judgement varies from one observer to the next.</p>
      </header>

      <div class="card login-card">
        <div class="page-head">
          <h2>Participant information</h2>
          <p class="muted">Three quick details, then you can start. No patient data is collected.</p>
        </div>
        <div class="field">
          <label for="f-name">Name or initials</label>
          <input id="f-name" placeholder="e.g. A.P. or Ann" autocomplete="off" maxlength="40">
          <span class="field-hint">Part of your name or initials is enough — it only groups your responses.</span>
        </div>
        <div class="field"><label for="f-status">Professional role</label>
          <select id="f-status"><option value="">Select…</option><option>Nurse</option><option>Doctor</option><option>Medical student</option><option>Paramedic</option><option>Researcher</option><option>Other</option></select></div>
        <div class="field"><label for="f-age">Age group</label>
          <select id="f-age"><option value="">Select…</option><option>18-24</option><option>25-34</option><option>35-44</option><option>45-54</option><option>55+</option></select></div>
        <button class="btn block" onclick="window.__act('login')">Start</button>
        ${state.err ? `<div class="err">${esc(state.err)}</div>` : ''}
      </div>

      <aside class="about-panel">
        <figure class="about-quote">
          <span class="qm open" aria-hidden="true">&ldquo;</span>
          <blockquote><span id="typed"></span><span class="caret" aria-hidden="true"></span></blockquote>
          <span class="qm close" aria-hidden="true">&rdquo;</span>
        </figure>

        <!-- The study itself is introduced in the hero above, so this panel
             carries only what a participant still needs to know before they
             agree to take part: what it costs them, and what is recorded. -->
        <div class="about-body">
          <span class="about-eyebrow">At a glance</span>
          <ul class="about-steps">
            <li><span class="n">1</span><div><b>${SET_SIZE} clips</b> per set, a few seconds each</div></li>
            <li><span class="n">2</span><div><b>About 5 minutes</b> — stop after any set</div></li>
            <li><span class="n">3</span><div><b>One button</b> to press, nothing to choose</div></li>
          </ul>

          <div class="about-note">
            <b>No full names.</b> Initials are enough — they only group your own responses. No patient data is collected.
          </div>

          <p class="about-foot">Saves automatically · Works on a phone</p>
        </div>
      </aside>
    </div>`;
  }

  /* =========================================================================
     FIRST-RUN ONBOARDING
     A 3-page "Next / Next / Start" walkthrough shown once per browser, right
     after each participant's first sign-in (gated per name, so everyone who
     as INTRO_KEY for the login typing animation). Skippable at any point;
     uses a shared device still gets it). Skippable at any point.
     ========================================================================= */
  const ONBOARD_PAGES = [
    {
      eyebrow: 'Step 1 of 3 · Watch',
      title: 'What you’re watching',
      body: 'Pressure is held on the nail bed, then released. The screen flashes <b>green</b> for a moment at the release — that is when timing starts.',
      illo: 'press'
    },
    {
      eyebrow: 'Step 2 of 3 · Respond',
      title: 'What to do',
      body: 'The instant the colour returns, press <b>Mark colour change</b>. Then press <b>Save &amp; Next</b>.',
      illo: 'mark'
    },
    {
      eyebrow: 'Step 3 of 3 · Begin',
      title: 'Your clips come to you',
      body: `Clips arrive one after another in sets of <b>${SET_SIZE}</b> — nothing to choose, nothing repeated, everything saved as you go.`,
      illo: 'pick'
    }
  ];

  /* Each step is illustrated with real frames of a study recording rather than
     a drawing, so the walkthrough shows exactly what the clip will look like.
     The green frame is not a graphic either: it is the same 3-frame, 50%-green
     release flash studio.py burns into every clip it encodes. */
  const OB_SHOT = {
    press:   { src: 'assets/crt-press.jpg?v=14',   alt: 'A glass piece pressing down on the nail bed, arrows showing the pressure' },
    release: { src: 'assets/crt-release.jpg?v=14', alt: 'The moment of release, the frame flashing green' },
    refill:  { src: 'assets/crt-refill.jpg?v=14',  alt: 'The nail bed a moment later, its colour returned' }
  };
  const shot = (k, cap) => `<figure class="ob-shot">
      <img src="${OB_SHOT[k].src}" alt="${OB_SHOT[k].alt}" width="384" height="384"
           loading="eager" decoding="async">
      <figcaption>${cap}</figcaption>
    </figure>`;
  const obArrow = `<span class="ob-arrow" aria-hidden="true">${icon('fwd', 15)}</span>`;

  function onboardIllo(kind) {
    if (kind === 'press') {
      // The whole test in one line: pressure, the release flash, the refill.
      return `<div class="ob-scene ob-scene-press">
        ${shot('press', 'Pressure held')}${obArrow}
        ${shot('release', 'Released — green flash')}${obArrow}
        ${shot('refill', 'Colour returns')}
      </div>`;
    }
    if (kind === 'mark') {
      // Only the half that needs a response: the flash, then the moment to press.
      return `<div class="ob-scene ob-scene-mark">
        ${shot('release', 'Green flash')}${obArrow}${shot('refill', 'Mark here')}
        <div class="ob-mark-side">
          <div class="ob-mini-mark">${icon('dot', 11)} Mark<span class="ob-ripple"></span></div>
          <div class="ob-mini-result">0.86s marked</div>
        </div>
      </div>`;
    }
    // A strip of clips waiting, with the run of SET_SIZE filling up one by one.
    const dots = Array.from({ length: SET_SIZE },
      (_, i) => `<span style="animation-delay:${(i * 0.26).toFixed(2)}s"></span>`).join('');
    const strip = [1, 2, 3].map(n =>
      `<img src="assets/crt-thumb${n}.jpg?v=14" alt="" width="192" height="192" loading="lazy" decoding="async">`
    ).join('') + `<span class="ob-strip-more" aria-hidden="true">&hellip;</span>`
      + `<img src="assets/crt-thumb4.jpg?v=14" alt="" width="192" height="192" loading="lazy" decoding="async">`;
    return `<div class="ob-scene ob-scene-pick">
      <div class="ob-set-pill">${icon('dot', 10)} one set &middot; ${SET_SIZE} clips</div>
      <div class="ob-set-dots">${dots}</div>
      <div class="ob-strip">${strip}</div>
    </div>`;
  }

  function viewOnboarding() {
    const page = Math.max(0, Math.min(ONBOARD_PAGES.length - 1, state.onboardPage || 0));
    const p = ONBOARD_PAGES[page];
    const isLast = page === ONBOARD_PAGES.length - 1;
    const dots = ONBOARD_PAGES.map((_, i) =>
      `<button class="ob-dot ${i === page ? 'active' : ''}" aria-label="Go to step ${i + 1}"
         aria-current="${i === page ? 'true' : 'false'}" onclick="window.__act('onboardgoto',${i})"></button>`
    ).join('');

    return `<div class="onboard-layout">
      <div class="card onboard-card">
        <div class="ob-top">
          <span class="ob-eyebrow">${p.eyebrow}</span>
          <button class="ob-skip" onclick="window.__act('onboardskip')">Skip</button>
        </div>
        <div class="ob-illo-wrap">${onboardIllo(p.illo)}</div>
        <h2 class="ob-title">${p.title}</h2>
        <p class="ob-body">${p.body}</p>
        <div class="ob-dots">${dots}</div>
        <div class="ob-nav">
          <button class="btn neutral" onclick="window.__act('onboardback')" ${page === 0 ? 'disabled' : ''}>${icon('back', 16)} Back</button>
          <button class="btn ob-primary" onclick="window.__act('${isLast ? 'onboardfinish' : 'onboardnext'}')">${isLast ? 'Start' : 'Next'} ${icon(isLast ? 'check' : 'fwd', 16)}</button>
        </div>
      </div>
    </div>`;
  }

  /* ---------- between-clip screens ----------
     The participant never picks anything: they sign in, watch, mark, and the
     app decides what comes next. These are the only pauses in that run. */
  function viewLoading() {
    return `<div class="card centred-card">
      <div class="vid-loading static"><span class="spin"></span> Preparing your clips…</div>
    </div>`;
  }

  function viewSetDone() {
    const left = Math.max(0, state.queue.length - state.qIndex);
    const doneTotal = state.qIndex;
    return `<div class="card centred-card run-done">
      <div class="run-tick">${icon('check', 26)}</div>
      <h2>Set ${setNumber() - 1} complete</h2>
      <p class="muted">That's <b>${doneTotal}</b> clip${doneTotal === 1 ? '' : 's'} marked. Thank you — your marks are saved.</p>
      <p class="muted small-note">${left} clip${left === 1 ? '' : 's'} still waiting, whenever you have time.</p>
      <button class="btn nextvid block" onclick="window.__act('nextset')">Continue with the next ${Math.min(SET_SIZE, left)} ${icon('fwd', 16)}</button>
      <button class="btn neutral block" onclick="window.__act('logout')">Finish for now</button>
    </div>`;
  }

  /* An empty library is NOT a finished run. Both used to land on "All done",
     which told a participant they had marked every clip when in fact nothing
     had loaded — and gave them no way to try again. */
  function viewLibraryUnavailable() {
    return `<div class="card centred-card run-done">
      <h2>The clips aren’t loading</h2>
      <p class="muted">${esc(state.libraryError || 'No clips are available right now.')}</p>
      <p class="muted small-note">Nothing you have already marked is lost — it is saved and will be sent as soon as the connection is back.</p>
      <button class="btn nextvid block" onclick="window.__act('retrylibrary')">${icon('retry', 16)} Try again</button>
      <button class="btn neutral block" onclick="window.__act('logout')">Sign out</button>
    </div>`;
  }

  function viewFinished() {
    return `<div class="card centred-card run-done">
      <div class="run-tick">${icon('check', 26)}</div>
      <h2>All done — thank you</h2>
      <p class="muted">You've marked every clip available to you. Nothing is repeated, so there's nothing further to watch right now.</p>
      <button class="btn neutral block" onclick="window.__act('logout')">Sign out</button>
    </div>`;
  }

  function viewPaused() {
    const left = Math.max(0, state.queue.length - state.qIndex);
    return `<div class="card centred-card run-done">
      <h2>Paused</h2>
      <p class="muted">${state.qIndex} clip${state.qIndex === 1 ? '' : 's'} marked so far · ${left} left.</p>
      <button class="btn nextvid block" onclick="window.__act('resume')">Back to the clip ${icon('fwd', 16)}</button>
      <button class="btn neutral block" onclick="window.__act('logout')">Finish for now</button>
    </div>`;
  }

  /* ---------- per-viewer watermark ----------
     Traceability, not prevention: nothing in a browser can stop a screenshot
     or a screen recording, but a leaked capture carries the account it came
     from. Sits INSIDE the picture, styled like a burned-in camera caption, so
     a crop of just the video still carries it. Kept to the corners at low
     opacity on purpose — this is a colour perception study, so the nail bed in
     the middle of the frame must stay completely unobstructed. */
  function watermarkHtml() {
    if (!state.user) return '';
    const who = `${state.user.name} · ${state.user.status}`;
    const when = new Date().toISOString().slice(0, 10);
    const tag = esc(`${who} · ${when}`);
    return `<div class="wmark" id="wmark" aria-hidden="true">
      <span class="wm tl">${tag}</span>
      <span class="wm br">${tag}</span>
    </div>`;
  }

  /* The video is object-fit:contain, so the picture rarely fills its box —
     there are empty margins either side. Left alone the watermark would float
     in that empty area instead of on the footage (and would be cropped off
     entirely in a screenshot of just the video). This measures the rendered
     picture and pins the overlay to exactly that rectangle. */
  function fitWatermark() {
    const vid = document.getElementById('vid');
    const wm = document.getElementById('wmark');
    if (!vid || !wm) return;
    const W = vid.clientWidth, H = vid.clientHeight;
    const vw = vid.videoWidth, vh = vid.videoHeight;
    if (!W || !H || !vw || !vh) return;
    const scale = Math.min(W / vw, H / vh);      // object-fit: contain
    const w = vw * scale, h = vh * scale;
    wm.style.left = ((W - w) / 2) + 'px';
    wm.style.top = ((H - h) / 2) + 'px';
    wm.style.width = w + 'px';
    wm.style.height = h + 'px';
  }

  function viewPlayer() {
    const v = currentClip();
    if (!v) return `<div class="card muted">Loading clip…</div>`;
    const fps = Number(v.fps) || 30;
    const doneHere = setDone();          // finished so far in this run of 10
    const total = setTotal();
    const isLastOfSet = doneHere + 1 >= total;
    const pct = Math.round((doneHere / total) * 100);

    /* The counter is the whole progress story now: no collections, no clip
       list — just "how far through this run am I". */
    return `<div class="page-head run-head">
        <div class="player-title">
          <button class="btn neutral player-back" title="Pause and see your progress"
                  onclick="window.__act('pause')">${icon('back', 16)} Pause</button>
          <h2>Clip ${doneHere + 1} of ${total}</h2>
        </div>
        <span class="progress-pill">${doneHere} of ${total} done${setNumber() > 1 ? ` · set ${setNumber()}` : ''}</span>
      </div>
      <div class="run-bar" aria-hidden="true"><span style="width:${pct}%"></span></div>
      <div class="player-layout">
        <div class="video-panel">
          <div class="vid-stage">
            <video id="vid" src="${esc(v.url)}" playsinline preload="auto"
                   disablepictureinpicture controlslist="nodownload noremoteplayback"
                   oncontextmenu="return false" draggable="false"
                   onclick="window.__act('playpause')"></video>
            <div class="vid-loading" id="vidLoading"><span class="spin"></span> Buffering clip…</div>
            ${watermarkHtml()}
          </div>
          <div class="scrub-row">
            <button class="mini-play" id="miniPlay" title="Play / Pause (Space)"
                    onclick="window.__act('playpause')">▶</button>
            <div class="scrub-wrap">
              <input type="range" id="scrub" class="scrub" min="0" max="1000" value="0" step="1"
                     oninput="window.__scrub(this.value)" title="Scrub through the clip">
              <div class="stamp-tick" id="stampTick" hidden title="Pressure released (CRT = 0)"></div>
            </div>
          </div>
        </div>
        <div class="control-panel">
          <div class="readout">
            <div class="clock">
              <span class="lbl">${v.stampFrame != null ? 'Time from pressure release' : 'Video time'}</span>
              <span class="val" id="clock">00:00.00</span>
              <span class="frame" id="frame">${v.stampFrame != null ? `release frame ${v.stampFrame}` : `frame 0 · ${fps} fps`}</span>
            </div>
            <button class="mark-btn" id="markBtn" onclick="window.__act('mark')">${icon('dot', 13)} Mark colour change <kbd>M</kbd></button>
          </div>
          <button class="btn nextvid block" id="nextVidBtn"
                  title="Saves your mark, then moves on (N)"
                  onclick="window.__act('submit')">${isLastOfSet ? `Save &amp; finish set ${icon('check', 16)}` : `Save &amp; Next clip ${icon('fwd', 16)}`}</button>
          <div id="markPanel">${markPanelHtml()}</div>
          <div class="nav-row">
            <button class="btn neutral" onclick="window.__act('restart')">${icon('retry', 16)} Restart clip</button>
            <button class="btn neutral" title="This clip won't play? Move on without saving a mark"
                    onclick="window.__act('skip')">Skip clip ${icon('fwd', 16)}</button>
          </div>
          <div class="shortcuts">
            <span><kbd>Space</kbd> play / pause</span>
            <span><kbd>←</kbd><kbd>→</kbd> step 1 frame</span>
            <span><kbd>M</kbd> mark</span>
            <span><kbd>N</kbd> save &amp; next</span>
          </div>
        </div>
      </div>`;
  }

  /* The mark panel is re-rendered ON ITS OWN so that marking/saving never
     rebuilds the <video> element (which would restart buffering). */
  function markPanelHtml() {
    const v = currentClip();
    if (!v) return '';
    const fps = Number(v.fps) || 30;
    const crt = crtAt(v, state.marked);
    const mf = state.marked != null ? frameInFile(v, state.marked) : null;
    const body = state.marked != null
      ? `<div class="marked">
           <div class="headline">${crt != null ? 'Capillary refill time' : 'Colour change marked at'}</div>
           <div><span class="mt">${crt != null ? Math.max(0, crt).toFixed(2) + ' s' : fmt(state.marked)}</span></div>
           <div class="meta">${crt != null
              ? `frame ${mf} − release frame ${v.stampFrame} · ${v.realFps.toFixed(2)} fps`
              : `${state.marked.toFixed(3)} s · frame ${frameOf(state.marked, fps)}`}</div>
           <div class="actions">
             <button class="btn ghost small" onclick="window.__act('remark')">${icon('retry', 15)} Re-mark</button>
           </div>
         </div>`
      : `<div class="hint">Play the clip, then press <b>Mark</b> the moment the colour returns.</div>`;
    return body
      + (state.msg ? `<div class="ok">${esc(state.msg)}</div>` : '')
      + (state.err ? `<div class="err">${esc(state.err)}</div>` : '');
  }
  function renderMarkPanel() {
    const el = document.getElementById('markPanel');
    if (el) el.innerHTML = markPanelHtml();
  }

  /* ---------- live clock + transport ---------- */
  let clockTimer = null;
  function playerCtx() {
    const v = currentClip();
    return { vid: document.getElementById('vid'), fps: Number(v?.fps) || 30 };
  }
  let scrubbing = false;
  // Current video object (for stamp/CRT lookups).
  function currentVideo() { return currentClip(); }
  // Frame in the FILE at video-time t (the encoded/file fps).
  function frameInFile(v, t) {
    const ff = (v && v.fps) || 30;
    return Math.round(t * ff);
  }
  // Real capillary refill time at video-time t: (frame − stampFrame) / realFps.
  // The stamp lives in the recording's timeline, bridged to the file by frame #.
  function crtAt(v, t) {
    if (!v || v.stampFrame == null || !v.fps || !v.realFps) return null;
    return (frameInFile(v, t) - v.stampFrame) / v.realFps;
  }
  function updateClockNow() {
    const { vid, fps } = playerCtx();
    if (!vid) return;
    const v = currentVideo();
    const c = document.getElementById('clock');
    const f = document.getElementById('frame');
    const pp = document.getElementById('playpause');
    const sc = document.getElementById('scrub');
    const t = vid.currentTime;
    const crt = crtAt(v, t);
    if (crt != null) {
      // Stamped clip: count time from the pressure release only (never negative).
      if (c) c.textContent = fmt(Math.max(0, crt));
      const cf = frameInFile(v, t);
      if (f) f.textContent = crt < 0
        ? `before release · frame ${cf} of ${v.stampFrame}`
        : `frame ${cf} · release frame ${v.stampFrame} · ${v.realFps.toFixed(1)} fps`;
    } else {
      if (c) c.textContent = fmt(t);
      if (f) f.textContent = `frame ${frameOf(t, fps)} · ${fps} fps`;
    }
    const icon = vid.paused ? '▶' : '⏸';
    if (pp) pp.textContent = icon;
    const mp = document.getElementById('miniPlay');
    if (mp) mp.textContent = icon;
    if (sc && !scrubbing && isFinite(vid.duration) && vid.duration > 0) {
      sc.value = String(Math.round((t / vid.duration) * 1000));
    }
  }
  function startClock() {
    stopClock();
    clockTimer = setInterval(updateClockNow, 40);
    updateClockNow();
  }
  function stopClock() {
    if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
  }

  /* Scrub bar — seeks while paused so stepping stays frame-accurate. */
  window.__scrub = function(val) {
    const { vid } = playerCtx();
    if (!vid || !isFinite(vid.duration)) return;
    scrubbing = true;
    vid.currentTime = (Number(val) / 1000) * vid.duration;
    updateClockNow();
    clearTimeout(window.__scrubT);
    window.__scrubT = setTimeout(() => { scrubbing = false; }, 250);
  };

  // Place the little marker on the scrub bar at the release (stamp) point.
  function positionStampTick(vid, v) {
    const tick = document.getElementById('stampTick');
    if (!tick) return;
    if (!v || v.releaseFileTime == null || !isFinite(vid.duration) || vid.duration <= 0) { tick.hidden = true; return; }
    tick.style.left = Math.max(0, Math.min(1, v.releaseFileTime / vid.duration)) * 100 + '%';
    tick.hidden = false;
  }

  /* ---------- buffering: hold the UI until the clip can play through ----------
     Marking must never be possible on a half-loaded clip, and the video element
     is never rebuilt mid-session, so this runs once per loaded clip. */
  function setReady(ready) {
    const overlay = document.getElementById('vidLoading');
    const markBtn = document.getElementById('markBtn');
    if (overlay) overlay.style.display = ready ? 'none' : '';
    if (markBtn) markBtn.disabled = !ready;
    document.querySelectorAll('.transport .tbtn').forEach(b => { b.disabled = !ready; });
  }
  function attachVideoEvents() {
    const vid = document.getElementById('vid');
    if (!vid) return;
    // Keep the chosen slow-mo across clips. load() resets playbackRate to 1,
    // so (re)apply it once metadata is ready, not just now.
    const applySpeed = () => { vid.playbackRate = state.speed || 1; };
    applySpeed();
    const v0 = currentVideo();
    // Clips always start at the BEGINNING (so the press itself is visible);
    // the release is shown as a red dot on the scrub bar instead.
    const onMeta = () => {
      applySpeed();
      // Size the video box to the clip's real aspect ratio (no wasted width).
      if (vid.videoWidth && vid.videoHeight) {
        const stage = vid.closest('.vid-stage');
        if (stage) stage.style.setProperty('--vid-ar', vid.videoWidth + ' / ' + vid.videoHeight);
      }
      // For stamped clips, derive the ENCODED fps exactly from frame_count and
      // the real file duration, then place the release at stampFrame / fileFps.
      if (v0 && v0.stampFrame != null && v0.frameCount && isFinite(vid.duration) && vid.duration > 0) {
        v0.fps = v0.frameCount / vid.duration;   // fileFps
        v0.fpsMeasured = true;                    // trust this over passive detection
        v0.releaseFileTime = v0.stampFrame / v0.fps;
      }
      positionStampTick(vid, v0);
      fitWatermark();          // needs videoWidth/videoHeight, so not before now
      updateClockNow();
    };
    vid.addEventListener('loadedmetadata', onMeta);

    // Robust "ready" handling. The controls unlock as soon as the clip can be
    // played/seeked, and — crucially — STAY unlocked. A 'waiting' during a
    // frame-step seek used to disable everything with no event to re-enable it
    // (while paused, 'playing' never fires), leaving the buffering overlay and
    // buttons stuck. Now 'waiting' only shows the overlay on the FIRST load.
    let everReady = false;
    setReady(false);
    const markReady = () => {
      if (!everReady) { everReady = true; applySpeed(); }
      setReady(true);
    };
    vid.addEventListener('loadeddata', () => { if (vid.readyState >= 2) markReady(); });
    vid.addEventListener('canplay', markReady);
    vid.addEventListener('canplaythrough', markReady);
    vid.addEventListener('playing', markReady);
    vid.addEventListener('seeked', () => { if (everReady) setReady(true); updateClockNow(); });
    vid.addEventListener('waiting', () => { if (!everReady) setReady(false); });
    vid.addEventListener('play', updateClockNow);
    vid.addEventListener('pause', updateClockNow);
    vid.addEventListener('error', () => {
      const overlay = document.getElementById('vidLoading');
      if (overlay) overlay.innerHTML = 'Could not load this clip. Reload the page, or check the file.';
    });
    // Safety net: never leave the overlay stuck if the browser is stingy with
    // 'canplaythrough' — once metadata is in, unlock after a short grace period.
    setTimeout(() => { if (!everReady && vid.readyState >= 1) markReady(); }, 4000);
    if (vid.readyState >= 2) markReady();

    // Keep the overlay glued to the picture as the layout changes. A
    // ResizeObserver catches rail reflow and phone rotation, which a window
    // resize listener alone would miss.
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => fitWatermark());
      ro.observe(vid);
    }
    window.addEventListener('resize', fitWatermark);

    vid.load();

    // Fallback frame-rate detection from rendered frames — ONLY for clips with
    // no stamp.json (frameCount is our deterministic source when present).
    // This must never touch a stamped clip's fps: onMeta() has already computed
    // it exactly from frame_count/duration, and a stamped clip's frame numbers
    // are load-bearing for CRT math. Passive playback timing is noisy (display
    // refresh, dropped frames) and previously raced onMeta, silently
    // overwriting the correct fps the moment the student pressed Play —
    // which made every frame-step jump the wrong amount of real time.
    if (v0 && !v0.frameCount) {
      detectFps(vid, fps => {
        if (fps && isFinite(fps) && fps > 1 && !v0.frameCount) {
          v0.fps = fps;
          v0.fpsMeasured = true;
          updateClockNow();   // refresh the "frame N · X fps" readout
        }
      });
    }
  }

  /* Measures frame rate from the interval between real rendered frames while
     the clip is PLAYING (seeks are ignored), then snaps to the nearest standard
     rate. This corrects the frame number + the fps stored with each mark; it
     does NOT change the reported time, which is already exact real seconds. */
  function detectFps(vid, onFps) {
    if (!vid || !('requestVideoFrameCallback' in HTMLVideoElement.prototype)) return;
    const intervals = [];
    let last = null, frames = 0, finished = false;
    const finish = () => {
      if (finished) return; finished = true;
      if (intervals.length < 4) return;
      intervals.sort((a, b) => a - b);
      const med = intervals[Math.floor(intervals.length / 2)];
      if (!(med > 0)) return;
      let fps = 1 / med;
      // Snap to the NEAREST standard rate (not the first within range), so a
      // true 30 fps clip reports 30 rather than the adjacent 29.97.
      const common = [23.976, 24, 25, 29.97, 30, 48, 50, 59.94, 60, 120];
      let best = null, bestDiff = 0.5;
      for (const c of common) {
        const d = Math.abs(c - fps);
        if (d < bestDiff) { best = c; bestDiff = d; }
      }
      onFps(best != null ? best : Math.round(fps * 1000) / 1000);
    };
    const onFrame = (now, meta) => {
      if (last != null && !vid.paused) {
        const dt = meta.mediaTime - last;
        if (dt > 0.0002 && dt < 0.2) intervals.push(dt);   // ignore pause/seek jumps
      }
      last = meta.mediaTime;
      if (intervals.length >= 15) return finish();
      if (++frames < 150) vid.requestVideoFrameCallback(onFrame); else finish();
    };
    vid.requestVideoFrameCallback(onFrame);
  }

  /* Play/pause + precise frame stepping (pauses, then moves ±1 frame). */
  function togglePlay() {
    const { vid } = playerCtx();
    if (!vid) return;
    if (vid.paused) vid.play().catch(() => {}); else vid.pause();
    updateClockNow();
  }
  // Jump n seconds, clamped to the clip. The arrow/J/L keys and the jump
  // actions have always called this; it was simply never written.
  function seekBy(seconds) {
    const { vid } = playerCtx();
    if (!vid || !isFinite(vid.duration)) return;
    vid.pause();
    vid.currentTime = Math.min(Math.max(0, vid.currentTime + seconds), vid.duration);
    updateClockNow();
  }
  function stepFrames(n) {
    const { vid, fps } = playerCtx();
    if (!vid) return;
    vid.pause();
    const frame = frameOf(vid.currentTime, fps);          // floor-based: steps both ways
    const lastFrame = isFinite(vid.duration) ? Math.max(0, Math.ceil(vid.duration * fps) - 1) : Infinity;
    const target = Math.min(Math.max(0, frame + n), lastFrame);
    // Aim at the frame's midpoint so we land inside it, never on its boundary.
    vid.currentTime = (target + 0.5) / fps;
    updateClockNow();
  }

  /* Keyboard (player only): Space=play/pause, ←/→ or , . =frame step
     (Shift = 10 frames), ↑/↓ or J/L = 1 s, M=mark, R=restart. */
  function onPlayerKey(e) {
    if (state.view !== 'player') return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    const step = e.shiftKey ? 10 : 1;
    switch (e.code) {
      case 'Space': case 'KeyK': e.preventDefault(); togglePlay(); break;
      case 'ArrowLeft': case 'Comma': e.preventDefault(); stepFrames(-step); break;
      case 'ArrowRight': case 'Period': e.preventDefault(); stepFrames(step); break;
      case 'ArrowDown': case 'KeyJ': e.preventDefault(); seekBy(-1); break;
      case 'ArrowUp': case 'KeyL': e.preventDefault(); seekBy(1); break;
      case 'KeyM': e.preventDefault(); window.__act('mark'); break;
      case 'KeyN': e.preventDefault(); window.__act('submit'); break;
      case 'KeyR': e.preventDefault(); window.__act('restart'); break;
      default: return;
    }
  }
  document.addEventListener('keydown', onPlayerKey, true);

  /* Keyboard (onboarding only): →/N = next, ←/P = back, Esc = skip. */
  function onOnboardKey(e) {
    if (state.view !== 'onboarding') return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      window.__act((state.onboardPage || 0) >= ONBOARD_PAGES.length - 1 ? 'onboardfinish' : 'onboardnext');
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      window.__act('onboardback');
    } else if (e.key === 'Escape') {
      e.preventDefault();
      window.__act('onboardskip');
    }
  }
  document.addEventListener('keydown', onOnboardKey, true);

  /* ---------- actions ---------- */
  window.__act = async function(act, id) {
    state.msg = ''; state.err = '';

    if (act === 'theme') return toggleTheme();

    if (act === 'login') {
      const name = document.getElementById('f-name').value.trim();
      const status = document.getElementById('f-status').value;
      const age = document.getElementById('f-age').value;
      if (!name || !status) { state.err = 'Name and status are required.'; return render(); }
      state.user = { name, status, age };
      // A fresh order each sign-in, so two participants never march through
      // the clips in step. The queue itself is assembled below.
      state.orderSeed = newOrderSeed();
      state.queueReady = false;
      // Walk through the explainer while the queue is being put together;
      // otherwise hold on a brief "preparing" card.
      if (hasOnboarded(name)) { state.view = 'loading'; }
      else { state.view = 'onboarding'; state.onboardPage = 0; }
      render();
      await prepareQueue();
      // Don't yank someone out of the walkthrough just because the queue landed.
      if (state.view === 'loading') state.view = nextView();
      return render();
    }
    if (act === 'onboardnext') { state.onboardPage = Math.min(ONBOARD_PAGES.length - 1, (state.onboardPage || 0) + 1); return render(); }
    if (act === 'onboardback') { state.onboardPage = Math.max(0, (state.onboardPage || 0) - 1); return render(); }
    if (act === 'onboardgoto') { state.onboardPage = Math.max(0, Math.min(ONBOARD_PAGES.length - 1, Number(id) || 0)); return render(); }
    if (act === 'onboardskip' || act === 'onboardfinish') { return finishOnboarding(); }
    if (act === 'logout') {
      state.user = null; state.view = 'login'; state.marked = null;
      state.queue = []; state.qIndex = 0; state.queueReady = false;
      stopClock();
      try { localStorage.removeItem(SESSION_KEY); } catch {}
      return render();
    }
    if (act === 'pause')   { stopClock(); state.view = 'paused'; return render(); }
    if (act === 'retrylibrary') {
      state.view = 'loading'; state.libraryError = ''; state.queueReady = false;
      render();
      discovery = discoverAll();
      await prepareQueue();
      state.view = nextView();
      return render();
    }
    if (act === 'resume')  { state.view = nextView(); return render(); }
    if (act === 'nextset') { state.view = nextView(); return render(); }
    if (act === 'restart') {
      const vid = document.getElementById('vid');
      if (vid) { vid.currentTime = 0; vid.play().catch(() => {}); }
      return;
    }

    // Move to the next clip WITHOUT recording anything — the escape hatch for a
    // clip that won't play, so a participant is never stuck on a dead video.
    if (act === 'skip') { return advanceQueue(); }

    // Transport controls mutate the <video> in place — never re-render here,
    // or the element is rebuilt and playback position is lost.
    if (act === 'playpause') { togglePlay();   return; }
    if (act === 'stepback')  { stepFrames(-1); return; }
    if (act === 'stepfwd')   { stepFrames(1);  return; }
    if (act === 'jumpback')  { seekBy(-1);     return; }
    if (act === 'jumpfwd')   { seekBy(1);      return; }
    if (act === 'speed') {   // slow-mo doesn't change the marked time, only how it plays
      state.speed = Number(id) || 1;
      const { vid } = playerCtx();
      if (vid) vid.playbackRate = state.speed;
      document.querySelectorAll('.speed-btn').forEach(b =>
        b.classList.toggle('active', b.textContent === (state.speed === 1 ? '1×' : state.speed + '×')));
      return;   // no render — must not rebuild the <video>
    }

    // Marking must NOT call render() — that would rebuild <video> and re-buffer.
    if (act === 'mark') {
      const vidEl = document.getElementById('vid');
      if (!vidEl || vidEl.currentTime <= 0) { state.err = 'Play the clip first, then mark.'; return renderMarkPanel(); }
      vidEl.pause();
      const v = currentVideo();
      if (v && v.stampFrame != null && v.fps && frameInFile(v, vidEl.currentTime) < v.stampFrame) {
        state.err = `That's before the release (frame ${v.stampFrame}). Step forward past the release, then mark the colour return.`;
        return renderMarkPanel();
      }
      state.marked = vidEl.currentTime;
      updateClockNow();
      return renderMarkPanel();
    }
    if (act === 'remark') { state.marked = null; return renderMarkPanel(); }

    if (act === 'submit') {
      if (state.saving) return;
      const v = currentClip();
      if (!v) return render();
      const fps = Number(v.fps) || 30;
      const goNext = advanceQueue;   // shared with the "Skip clip" button

      // No mark → treat the green button as a plain "skip to next clip".
      if (state.marked == null) return goNext();

      const crt = crtAt(v, state.marked);
      const rawTime = Number(state.marked.toFixed(3));           // file position (s) of the mark
      const markedFrame = frameInFile(v, state.marked);           // recording frame at the mark
      const payload = {
        name: state.user.name,
        status: state.user.status,
        age: state.user.age,
        collection: v.collectionName || '',
        videoIndex: v.videoNumber ?? (state.qIndex + 1),
        videoTitle: v.title,
        videoId: v.videoId || null,   // FK into the Supabase `videos` table
        // timeSeconds is the study value: real CRT since release when stamped,
        // otherwise the raw mark time.
        timeSeconds: crt != null ? Number(Math.max(0, crt).toFixed(3)) : rawTime,
        crtSeconds: crt != null ? Number(Math.max(0, crt).toFixed(3)) : '',
        rawTimeSeconds: rawTime,
        stampTimeSeconds: v.releaseFileTime != null ? Number(v.releaseFileTime.toFixed(3)) : '',
        fps: v.realFps != null ? Number(v.realFps.toFixed(3)) : fps,   // capture fps (drives CRT)
        frameIndex: markedFrame,
        stampFrame: v.stampFrame != null ? v.stampFrame : '',
        submittedAt: new Date().toISOString()
      };
      // 1) Store LOCALLY first — this can never fail, so the mark is safe even
      //    if the Excel helper (or, later, the network) is down.
      const rec = { ...payload, synced: false };
      annotations.push(rec);
      saveAnnotations();
      // 2) Try to push to the backend in the background; a failure just leaves
      //    the record queued (the header shows "N unsaved" to retry later).
      state.saving = true; renderMarkPanel();
      try {
        await saveToExcel(payload);
        rec.synced = true;
        saveAnnotations();
      } catch (e) { /* stays queued; flushQueue() retries */ }
      state.saving = false;
      return goNext();   // always advance — the annotation is already stored
    }

    if (act === 'retrysync') { await flushQueue(); return render(); }
  };

  /* Push any annotations that never reached the backend. Stops on the first
     failure (backend still down) and leaves the rest queued. */
  async function flushQueue() {
    const pending = annotations.filter(a => a.synced === false);
    for (const a of pending) {
      try { await saveToExcel(a); a.synced = true; }
      catch { break; }
    }
    saveAnnotations();
  }

  // No system-theme listener: the study pins dark by default and only the
  // explicit toggle changes it, so the OS setting must not override the view.

  // Auto-hide the sticky header on scroll-down (reclaims space, esp. on phones);
  // it slides back in the moment you scroll up.
  (() => {
    const hdr = document.querySelector('.hdr');
    if (!hdr) return;
    let lastY = 0, ticking = false;
    const apply = () => {
      const y = Math.max(0, window.scrollY || document.documentElement.scrollTop || 0);
      if (y > lastY + 5 && y > 70) hdr.classList.add('hdr-hidden');      // scrolling down
      else if (y < lastY - 5 || y <= 4) hdr.classList.remove('hdr-hidden'); // scrolling up / at top
      lastY = y; ticking = false;
    };
    window.addEventListener('scroll', () => {
      if (!ticking) { requestAnimationFrame(apply); ticking = true; }
    }, { passive: true });
  })();

  /* ---------- load videos + collections from Supabase ---------- */
  /* The `videos` table already holds every stamp field that used to live in a
     per-clip .stamp.json, so there's no folder to scrape and no JSON to fetch.
     Each .mp4 is served from the public Storage bucket by its storage_path. */
  async function discoverAll() {
    let cols = [], vids = [];
    state.libraryError = '';
    try {
      const [colRes, vidRes] = await Promise.all([
        fetch(`${REST_URL}/collections?select=*&order=sort_order`, { headers: SUPA_HEADERS, cache: 'no-store' }),
        fetch(`${REST_URL}/videos?select=*&order=collection_id,video_number`, { headers: SUPA_HEADERS, cache: 'no-store' })
      ]);
      if (colRes.ok) cols = await colRes.json();
      if (vidRes.ok) vids = await vidRes.json();
      // A refused read is the usual cause of an empty library (a tightened RLS
      // policy, a rotated key). Say so — silently showing no clips reads to a
      // participant as "the videos aren't loading", with nothing to act on.
      else state.libraryError = `The clip list could not be read (error ${vidRes.status}).`;
    } catch {
      state.libraryError = 'Could not reach the clip library. Check your connection.';
    }

    // Clips whose collection row is missing (or unreadable) would otherwise be
    // dropped without trace, emptying the library while both requests "worked".
    if (vids.length && !cols.length) {
      cols = [{ id: '__all', name: 'CRT clips', icon: '📁', sort_order: 0 }];
      vids = vids.map(v => ({ ...v, collection_id: '__all' }));
    }

    const built = [];
    for (const c of cols) {
      const clips = vids
        .filter(v => v.collection_id === c.id)
        // A row with no file behind it cannot be played, and letting one
        // through used to throw here — which killed discovery outright and
        // left the whole app stuck with an empty library.
        .filter(v => v && typeof v.storage_path === 'string' && v.storage_path)
        .sort((a, b) => a.video_number - b.video_number)
        .map(v => {
          const realFps = (v.frame_count && v.recording_duration_s)
            ? v.frame_count / v.recording_duration_s
            : (Number(v.capture_fps) || null);
          return {
            id: c.id + '-' + v.video_number,
            videoId: v.id,                 // UUID FK for annotations
            videoNumber: v.video_number,   // stable position IN THE COLLECTION
            title: v.title || ('CRT Test ' + String(v.video_number).padStart(2, '0')),
            file: v.storage_path,
            url: BUCKET_PUBLIC_URL + v.storage_path.split('/').map(encodeURIComponent).join('/'),
            // fileFps: encoded rate of the .mp4 (used for frame stepping and for
            // turning video-time into a frame number). Refined once metadata loads.
            fps: Number(FPS_OVERRIDES[v.storage_path]) || Number(v.encoded_fps) || DEFAULT_FPS,
            // realFps: true CAPTURE rate; CRT is bridged by frame number:
            //   real CRT = (markedFrame − stampFrame) / realFps.
            realFps: realFps,
            stampFrame: v.stamped_frame != null ? v.stamped_frame : null,
            stamped: !!v.stamped,
            frameCount: v.frame_count != null ? v.frame_count : null,
            recDuration: v.recording_duration_s != null ? v.recording_duration_s : null,
            stampTimeS: v.stamp_time_s != null ? v.stamp_time_s : null,
            // Which collection it came from — recorded with the mark, but never
            // shown as a choice: participants just receive the next clip.
            collectionName: c.name,
            // Marks already collected for this clip; drives the running order.
            // Absent until supabase_balancing.sql has been run, which reads as 0.
            timesAnnotated: Number(v.times_annotated) || 0
          };
        });
      if (clips.length) built.push({ id: c.id, name: c.name, icon: c.icon || '📁', videos: clips });
    }

    if (built.length) {
      COLLECTIONS = built;
      POOL = built.flatMap(c => c.videos);
      state.libraryError = '';
    } else if (!POOL.length) {
      COLLECTIONS = MANUAL_COLLECTIONS.map(c => ({ ...c }));
      POOL = COLLECTIONS.flatMap(c => c.videos || []);
      if (!POOL.length && !state.libraryError) {
        state.libraryError = 'The clip library came back empty — no videos are published yet.';
      }
    }
    render();
  }

  render();
  discovery = discoverAll();
  // A restored session lands straight back in the player, so its queue has to
  // be rebuilt before anything can be shown.
  if (state.user) prepareQueue().then(() => render());
  flushQueue().then(() => render());   // retry any marks left unsaved from a previous session
})();
</script>
</body>
</html>
